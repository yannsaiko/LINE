<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージデータ統合解析ビューアー</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary: #3b82f6;
            --primary-light: #eff6ff;
            --border-color: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* ファイルドロップエリア */
        .drop-zone {
            background: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        /* ダッシュボードグリッド */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .card-title {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-subtext {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* グラフ＆詳細エリア */
        .analytics-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) {
            .analytics-section {
                grid-template-columns: 1fr;
            }
        }

        /* 時間帯アクティビティバー */
        .chart-container {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 120px;
            padding-top: 16px;
        }

        .bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            background: var(--primary);
            border-radius: 2px 2px 0 0;
            min-height: 2px;
            transition: height 0.3s;
        }

        .bar-label {
            font-size: 0.625rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* 送信者ランキングリスト */
        .sender-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sender-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sender-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
        }

        .progress-bar-bg {
            background: var(--bg-color);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            border-radius: 4px;
        }

        /* フィルター＆検索 */
        .filter-bar {
            background: var(--card-bg);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-size: 0.875rem;
        }

        .filter-bar input[type="search"] {
            flex: 1;
            min-width: 200px;
        }

        /* タイムライン表示 */
        .chat-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            max-height: 600px;
            overflow-y: auto;
        }

        .date-divider {
            text-align: center;
            margin: 20px 0 12px;
            position: relative;
        }

        .date-divider::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--border-color);
            z-index: 1;
        }

        .date-label {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            padding: 0 12px;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .msg-bubble {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .msg-header {
            display: flex;
            gap: 8px;
            align-items: baseline;
            margin-bottom: 2px;
        }

        .msg-sender {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .msg-time {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .msg-content {
            background: var(--bg-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>メッセージデータ統合解析ビューアー</h1>
        <button class="btn btn-outline" id="btnDemo">デモデータを表示</button>
    </header>

    <!-- ファイル選択エリア -->
    <div class="drop-zone" id="dropZone">
        <p style="font-weight: 600; margin-bottom: 8px;">JSONファイルをドラッグ＆ドロップ</p>
        <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 16px;">またはファイルを選択してください</p>
        <input type="file" id="fileInput" accept=".json" class="hidden">
        <button class="btn" onclick="document.getElementById('fileInput').click()">ファイルを選択</button>
    </div>

    <!-- 解析結果エリア -->
    <div id="analyticsWrapper" class="hidden">
        <!-- KPIカード -->
        <div class="dashboard-grid">
            <div class="card">
                <div class="card-title">総メッセージ数</div>
                <div class="card-value" id="statTotalMsgs">0</div>
                <div class="card-subtext" id="statAvgPerDay">1日あたり: 0件</div>
            </div>
            <div class="card">
                <div class="card-title">アクティブ期間</div>
                <div class="card-value" id="statActiveDays">0 日</div>
                <div class="card-subtext" id="statDateRange">-</div>
            </div>
            <div class="card">
                <div class="card-title">最多発言者</div>
                <div class="card-value" id="statTopSender">-</div>
                <div class="card-subtext" id="statTopSenderCount">0 件</div>
            </div>
        </div>

        <!-- グラフ分析 -->
        <div class="analytics-section">
            <!-- 発言者シェア -->
            <div class="card">
                <div class="card-title">送信者割合</div>
                <ul class="sender-list" id="senderList"></ul>
            </div>
            <!-- 時間帯アクティビティ -->
            <div class="card">
                <div class="card-title">時間帯別アクティビティ (24時間)</div>
                <div class="chart-container" id="hourlyChart"></div>
            </div>
        </div>

        <!-- 検索・フィルター -->
        <div class="filter-bar">
            <input type="search" id="searchInput" placeholder="メッセージ本文を検索...">
            <select id="senderFilter"><option value="">すべての送信者</option></select>
        </div>

        <!-- チャットログ -->
        <div class="chat-container" id="chatContainer"></div>
    </div>

    <script>
        const COCOA_OFFSET_SEC = 978307200;
        let globalRawData = [];

        // DOM要素
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const analyticsWrapper = document.getElementById('analyticsWrapper');
        const searchInput = document.getElementById('searchInput');
        const senderFilter = document.getElementById('senderFilter');

        // イベント設定
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });
        document.getElementById('btnDemo').addEventListener('click', loadDemoData);
        searchInput.addEventListener('input', filterAndRenderChat);
        senderFilter.addEventListener('change', filterAndRenderChat);

        // ファイル読み込み
        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const json = JSON.parse(e.target.result);
                    processData(Array.isArray(json) ? json : (json.messages || []));
                } catch (err) {
                    alert('JSONファイルの読み込みに失敗しました。形式を確認してください。');
                }
            };
            reader.readAsText(file);
        }

        // データ処理 & 解析呼び出し
        function processData(messages) {
            globalRawData = messages.map(m => ({
                sender: m.sender || m.user || m.from || 'Unknown',
                text: m.text || m.message || m.body || '',
                date: parseTimestamp(m.timestamp || m.date || m.time)
            })).sort((a, b) => a.date - b.date);

            if (globalRawData.length === 0) {
                alert('解析可能なメッセージデータが見つかりませんでした。');
                return;
            }

            analyticsWrapper.classList.remove('hidden');
            renderAnalytics(globalRawData);
            populateSenderFilter(globalRawData);
            filterAndRenderChat();
        }

        // データ解析＆ダッシュボード描画
        function renderAnalytics(data) {
            const total = data.length;
            const senderCounts = {};
            const hourlyCounts = new Array(24).fill(0);

            data.forEach(m => {
                senderCounts[m.sender] = (senderCounts[m.sender] || 0) + 1;
                hourlyCounts[m.date.getHours()]++;
            });

            // 期間計算
            const firstDate = data[0].date;
            const lastDate = data[data.length - 1].date;
            const diffTime = Math.abs(lastDate - firstDate);
            const diffDays = Math.max(1, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));

            // KPI更新
            document.getElementById('statTotalMsgs').textContent = total.toLocaleString();
            document.getElementById('statAvgPerDay').textContent = `1日あたり: ${(total / diffDays).toFixed(1)}件`;
            document.getElementById('statActiveDays').textContent = `${diffDays} 日間`;
            document.getElementById('statDateRange').textContent = `${formatDate(firstDate)} ~ ${formatDate(lastDate)}`;

            // Top送信者
            const sortedSenders = Object.entries(senderCounts).sort((a, b) => b[1] - a[1]);
            document.getElementById('statTopSender').textContent = sortedSenders[0][0];
            document.getElementById('statTopSenderCount').textContent = `${sortedSenders[0][1].toLocaleString()} 件`;

            // プログレスバー（送信者）描画
            const senderListEl = document.getElementById('senderList');
            senderListEl.innerHTML = sortedSenders.slice(0, 5).map(([sender, count]) => {
                const pct = ((count / total) * 100).toFixed(1);
                return `
                    <li class="sender-item">
                        <div class="sender-info">
                            <span>${escapeHtml(sender)}</span>
                            <span><b>${count}</b> (${pct}%)</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${pct}%"></div>
                        </div>
                    </li>`;
            }).join('');

            // 時間帯アクティビティグラフ描画
            const maxHourly = Math.max(...hourlyCounts) || 1;
            const chartEl = document.getElementById('hourlyChart');
            chartEl.innerHTML = hourlyCounts.map((count, hour) => {
                const heightPct = (count / maxHourly) * 100;
                return `
                    <div class="bar-wrapper" title="${hour}時: ${count}件">
                        <div class="bar" style="height: ${heightPct}%"></div>
                        <span class="bar-label">${hour}</span>
                    </div>`;
            }).join('');
        }

        // フィルター適用とチャット描画
        function filterAndRenderChat() {
            const keyword = searchInput.value.toLowerCase();
            const selectedSender = senderFilter.value;

            const filtered = globalRawData.filter(m => {
                const matchKeyword = !keyword || m.text.toLowerCase().includes(keyword);
                const matchSender = !selectedSender || m.sender === selectedSender;
                return matchKeyword && matchSender;
            });

            const chatEl = document.getElementById('chatContainer');
            chatEl.innerHTML = '';

            let lastDateStr = '';
            filtered.forEach(m => {
                const dateStr = formatDateHeader(m.date);
                if (dateStr !== lastDateStr) {
                    chatEl.innerHTML += `<div class="date-divider"><span class="date-label">${dateStr}</span></div>`;
                    lastDateStr = dateStr;
                }

                chatEl.innerHTML += `
                    <div class="msg-bubble">
                        <div class="msg-header">
                            <span class="msg-sender">${escapeHtml(m.sender)}</span>
                            <span class="msg-time">${formatTime(m.date)}</span>
                        </div>
                        <div class="msg-content">${escapeHtml(m.text)}</div>
                    </div>`;
            });
        }

        function populateSenderFilter(data) {
            const senders = [...new Set(data.map(m => m.sender))];
            senderFilter.innerHTML = '<option value="">すべての送信者</option>' + 
                senders.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
        }

        // ユーティリティ関数
        function parseTimestamp(val) {
            if (!val) return new Date();
            if (val instanceof Date) return val;
            if (typeof val === 'string') {
                const num = Number(val);
                if (!isNaN(num)) val = num;
                else {
                    const d = new Date(val);
                    if (!isNaN(d.getTime())) return d;
                }
            }
            if (typeof val === 'number') {
                if (val > 1e16) val = Math.floor(val / 1000000); // ナノ秒
                else if (val > 1e13) val = Math.floor(val / 1000); // マイクロ秒

                if (val > 1e11) return new Date(val); // Unix ms

                if (val > 1e8 && val < 1e10) {
                    if (val < 1e9) return new Date((val + COCOA_OFFSET_SEC) * 1000); // Cocoa sec
                    else return new Date(val * 1000); // Unix sec
                }

                if (val > 1e10 && val <= 1e11) {
                    return new Date(val + (COCOA_OFFSET_SEC * 1000)); // Cocoa ms
                }
                return new Date(val);
            }
            return new Date();
        }

        function formatDate(d) {
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatDateHeader(d) {
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${days[d.getDay()]})`;
        }

        function formatTime(d) {
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // デモ用サンプルデータ生成
        function loadDemoData() {
            const senders = ['Alice', 'Bob', 'Charlie'];
            const sampleTexts = [
                'お疲れ様です！進捗いかがでしょうか？',
                '資料のレビュー完了しました。問題なさそうです。',
                'ありがとうございます！修正版を後ほど共有します。',
                '了解しました。明日打ち合わせしましょう。',
                'よろしくお願いいたします！'
            ];
            const demo = [];
            const now = Date.now();

            for (let i = 0; i < 60; i++) {
                const randomHoursAgo = Math.floor(Math.random() * 120);
                demo.push({
                    sender: senders[Math.floor(Math.random() * senders.length)],
                    text: sampleTexts[Math.floor(Math.random() * sampleTexts.length)],
                    timestamp: now - (randomHoursAgo * 3600 * 1000) - (Math.random() * 1800 * 1000)
                });
            }
            processData(demo);
        }
    </script>
</body>
</html>
