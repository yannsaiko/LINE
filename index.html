<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE トーク履歴マルチビューア (フォルダー全自動検索対応版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f5f5f5; color: #333; }
        header { background: #06c755; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 18px; font-weight: bold; }
        .btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        
        #drop-zone { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px dashed #06c755; margin: 20px; border-radius: 12px; background: white; text-align: center; padding: 20px; }
        #drop-zone.dragover { background: #e8f8ee; border-color: #00b348; }
        .file-inputs { margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .file-inputs label { background: #06c755; color: white; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background 0.2s; }
        .file-inputs label:hover { background: #05b34c; }
        .file-inputs input { display: none; }
        
        #app-container { flex: 1; display: none; height: calc(100vh - 80px); overflow: hidden; }
        #sidebar { width: 340px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .sidebar-section { padding: 10px; border-bottom: 1px solid #eee; background: #fafafa; }
        .sidebar-label { font-size: 11px; font-weight: bold; color: #666; margin-bottom: 4px; display: block; }
        select.styled-select, input.styled-input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
        
        #chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .chat-item:hover { background: #f8f8f8; }
        .chat-item.active { background: #e8f8ee; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #06c755; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .chat-meta { flex: 1; min-width: 0; }
        .chat-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-sub { font-size: 11px; color: #888; display: flex; justify-content: space-between; margin-top: 4px; }
        
        #main-content { flex: 1; display: flex; flex-direction: column; background: #abc1ee; }
        #chat-view { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        #empty-state { margin: auto; color: #333; text-align: center; font-size: 15px; font-weight: bold; }
        
        #messages-container { display: flex; flex-direction: column; gap: 12px; }
        .date-divider { text-align: center; margin: 10px 0; font-size: 12px; color: rgba(0,0,0,0.6); background: rgba(255,255,255,0.6); padding: 4px 14px; border-radius: 12px; align-self: center; }
        
        .msg-row { display: flex; gap: 8px; max-width: 75%; }
        .msg-row.other { align-self: flex-start; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        
        .msg-avatar { width: 34px; height: 34px; border-radius: 50%; background: #7d8b99; color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
        .msg-content { display: flex; flex-direction: column; }
        .msg-sender-name { font-size: 11px; color: #444; margin-bottom: 3px; font-weight: 500; }
        .msg-row.me .msg-sender-name { text-align: right; }
        
        .msg-body-wrap { display: flex; align-items: flex-end; gap: 6px; }
        .msg-row.me .msg-body-wrap { flex-direction: row-reverse; }
        
        .bubble { background: white; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
        .msg-row.me .bubble { background: #85e249; color: #000; }
        .msg-time { font-size: 10px; color: rgba(0,0,0,0.55); flex-shrink: 0; }
        
        #status-bar { background: #333; color: white; font-size: 12px; padding: 6px 15px; }
    </style>
    <!-- jsDelivr経由でファイルローカル実行（file://）に対応した完全独立型sql-asm.jsを読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-asm.js"></script>
</head>
<body>
    <header>
        <h1>LINE トーク履歴マルチビューア</h1>
        <button id="btn-reset" class="btn" style="display:none;" onclick="location.reload()">リセット</button>
    </header>

    <div id="drop-zone">
        <h2>ファイルまたはフォルダーをここにドロップ</h2>
        <p style="margin-top:8px; color:#666;">Line.sqlite / Talk.sqlite が入ったフォルダーを丸ごとドラッグ＆ドロップ可能です</p>
        <div class="file-inputs">
            <label>ファイルを選択<input type="file" id="file-input" multiple accept=".sqlite,.db"></label>
            <label>フォルダーを選択<input type="file" id="folder-input" webkitdirectory directory multiple></label>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <div class="sidebar-section">
                <span class="sidebar-label">👤 トーク相手を検索</span>
                <input type="text" id="chat-search" class="styled-input" placeholder="名前を入力..." oninput="filterChatList(this.value)">
            </div>
            <div id="chat-list"></div>
        </div>
        <div id="main-content">
            <div id="chat-view">
                <div id="empty-state">左のリストから対象のトークを選択してください</div>
            </div>
        </div>
    </div>

    <div id="status-bar">初期化中...</div>

    <script>
        let SQL = null;
        let databases = [];
        let allChatRooms = [];
        let activeChat = null;
        let rawMessages = [];

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                updateStatus('SQL.js エンジン初期化中...');
                if (typeof initSqlJs === 'undefined') {
                    throw new Error("sql.js ライブラリが読み込まれていません。インターネット接続を確認してください。");
                }
                SQL = await initSqlJs();
                updateStatus('準備完了: ファイルまたはフォルダーをドロップしてください');
            } catch (err) {
                updateStatus('初期化エラー: ' + err.message);
                alert('初期化エラー: ' + err.message);
            }
        });

        function updateStatus(text) {
            document.getElementById('status-bar').innerText = text;
        }

        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', async e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            updateStatus('フォルダー・ファイルを再帰探索中...');
            
            const files = await getFilesFromDataTransfer(e.dataTransfer);
            if (files.length > 0) processFiles(files);
        });

        document.getElementById('file-input').addEventListener('change', e => {
            processFiles(Array.from(e.target.files));
        });

        document.getElementById('folder-input').addEventListener('change', e => {
            processFiles(Array.from(e.target.files));
        });

        // ドロップされたフォルダー内を再帰的に走査して全ファイルを取得
        async function getFilesFromDataTransfer(dataTransfer) {
            const files = [];
            const items = dataTransfer.items;
            if (items && items.length > 0) {
                const promises = [];
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.kind === 'file') {
                        const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                        if (entry) {
                            promises.push(traverseFileTree(entry, files));
                        } else {
                            const file = item.getAsFile();
                            if (file) files.push(file);
                        }
                    }
                }
                await Promise.all(promises);
            } else if (dataTransfer.files) {
                files.push(...Array.from(dataTransfer.files));
            }
            return files;
        }

        function traverseFileTree(item, files) {
            return new Promise((resolve) => {
                if (item.isFile) {
                    item.file((file) => {
                        files.push(file);
                        resolve();
                    }, () => resolve());
                } else if (item.isDirectory) {
                    const dirReader = item.createReader();
                    const readEntries = () => {
                        dirReader.readEntries(async (entries) => {
                            if (!entries || entries.length === 0) {
                                resolve();
                            } else {
                                const promises = entries.map(entry => traverseFileTree(entry, files));
                                await Promise.all(promises);
                                readEntries();
                            }
                        }, () => resolve());
                    };
                    readEntries();
                } else {
                    resolve();
                }
            });
        }

        // ファイルがSQLiteデータベースかどうかの判定ヘッダーチェック
        function isSqliteFile(buffer) {
            if (buffer.byteLength < 16) return false;
            const arr = new Uint8Array(buffer, 0, 16);
            const magic = [83, 81, 76, 105, 116, 101, 32, 102, 111, 114, 109, 97, 116, 32, 51, 0];
            return magic.every((val, i) => arr[i] === val);
        }

        async function processFiles(files) {
            if (!SQL) {
                alert('SQLエンジンが初期化されていません。数秒待ってから再度お試しください。');
                return;
            }

            updateStatus(`解析中: 合計 ${files.length} 件のファイルをスキャン中...`);
            databases = [];
            allChatRooms = [];

            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                // 大容量メディアファイルをスキップ（パフォーマンス保護）
                if (f.size > 500 * 1024 * 1024) continue;

                try {
                    const buf = await f.arrayBuffer();
                    if (!isSqliteFile(buf)) continue;

                    const db = new SQL.Database(new Uint8Array(buf));
                    const schema = detectSchema(db);
                    if (!schema.msgTable) continue;

                    const { userMap, chatMap, myMid } = loadDictionaries(db, schema);
                    schema.myMid = myMid;

                    const dbObj = { id: 'db_' + databases.length, fileName: f.name, db, schema, userMap, chatMap };
                    databases.push(dbObj);

                    const rooms = fetchChatRooms(dbObj);
                    allChatRooms.push(...rooms);
                } catch (err) {
                    console.warn("スキップ:", f.name, err);
                }
            }

            if (databases.length === 0) {
                alert('フォルダー/ファイルからLINEの有効なデータベース（ZMESSAGE または chat_history）が見つかりませんでした。');
                updateStatus('エラー: 有効なLINEデータベースが見つかりませんでした');
                return;
            }

            renderChatList(allChatRooms);
            document.getElementById('drop-zone').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('btn-reset').style.display = 'inline-flex';
            updateStatus(`解析完了: ${allChatRooms.length} 件のトークルームを発見`);
        }

        function detectSchema(db) {
            const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table'")[0]?.values.map(r => r[0]) || [];
            if (tables.includes('ZMESSAGE')) {
                const cols = db.exec("PRAGMA table_info(ZMESSAGE)")[0].values.map(c => c[1]);
                return {
                    type: 'iOS',
                    msgTable: 'ZMESSAGE',
                    chatCol: cols.find(c => /^ZCHAT$/i.test(c)) || 'ZCHAT',
                    textCol: cols.find(c => /^ZTEXT$/i.test(c)) || 'ZTEXT',
                    timeCol: cols.find(c => /^ZCREATEDTIME$/i.test(c)) || 'ZCREATEDTIME',
                    isMeCol: cols.find(c => /^ZISFROMME$/i.test(c)) || null,
                    senderCol: cols.find(c => /^ZSENDER$/i.test(c)) || 'ZSENDER',
                    typeCol: cols.find(c => /^ZCONTENTTYPE$/i.test(c)) || 'ZCONTENTTYPE',
                    userTable: tables.includes('ZUSER') ? 'ZUSER' : null,
                    chatTable: tables.includes('ZCHAT') ? 'ZCHAT' : null
                };
            } else if (tables.includes('chat_history')) {
                const cols = db.exec("PRAGMA table_info(chat_history)")[0].values.map(c => c[1]);
                return {
                    type: 'Android',
                    msgTable: 'chat_history',
                    chatCol: cols.find(c => /chat_id/i.test(c)) || 'chat_id',
                    textCol: cols.find(c => /content/i.test(c)) || 'content',
                    timeCol: cols.find(c => /created_time/i.test(c)) || 'created_time',
                    isMeCol: cols.find(c => /is_sent|status/i.test(c)) || null,
                    senderCol: cols.find(c => /from_mid/i.test(c)) || 'from_mid',
                    typeCol: cols.find(c => /attachement_type|type/i.test(c)) || 'type',
                    userTable: tables.includes('contacts') ? 'contacts' : null,
                    chatTable: tables.includes('chat') ? 'chat' : null
                };
            }
            return {};
        }

        function loadDictionaries(db, sch) {
            let userMap = {}, chatMap = {}, myMid = null;
            try {
                const res = db.exec("SELECT * FROM setting WHERE key = 'my_mid' OR key = 'MY_MID'")[0];
                if (res && res.values.length > 0) myMid = String(res.values[0][1] || res.values[0][2] || '');
            } catch(e){}

            if (sch.userTable) {
                try {
                    const res = db.exec(`SELECT * FROM "${sch.userTable}"`)[0];
                    if (res) {
                        const cols = res.columns.map(c => c.toUpperCase());
                        const pkIdx = cols.findIndex(c => c === 'Z_PK' || c === 'ROWID' || c === 'ID' || c === '_ID');
                        const midIdx = cols.findIndex(c => c.includes('MID'));
                        const nameIdx = cols.findIndex(c => c.includes('NAME') || c.includes('DISPLAY'));
                        res.values.forEach(r => {
                            let name = nameIdx !== -1 ? r[nameIdx] : null;
                            if (name) {
                                if (pkIdx !== -1 && r[pkIdx]) userMap[r[pkIdx]] = String(name);
                                if (midIdx !== -1 && r[midIdx]) userMap[r[midIdx]] = String(name);
                            }
                        });
                    }
                } catch(e){}
            }
            return { userMap, chatMap, myMid };
        }

        function fetchChatRooms(dbObj) {
            const { id: dbId, fileName, db, schema: sch, userMap } = dbObj;
            const query = `
                SELECT "${sch.chatCol}", COUNT(*), MAX("${sch.timeCol}")
                FROM "${sch.msgTable}"
                WHERE "${sch.chatCol}" IS NOT NULL AND "${sch.chatCol}" != ''
                GROUP BY "${sch.chatCol}"
                ORDER BY 3 DESC
            `;
            let res;
            try { res = db.exec(query)[0]; } catch(e) { return []; }
            if (!res || !res.values) return [];

            return res.values.map(r => {
                const chatId = String(r[0]);
                let name = userMap[chatId] || `トーク (${chatId})`;
                const dateObj = parseTimestamp(r[2]);
                return { dbId, fileName, id: chatId, name, count: r[1], lastTime: dateObj ? formatDate(dateObj) : '' };
            });
        }

        function renderChatList(list) {
            const container = document.getElementById('chat-list');
            container.innerHTML = '';
            list.forEach(item => {
                const el = document.createElement('div');
                el.className = 'chat-item';
                el.innerHTML = `
                    <div class="avatar">${escapeHtml(item.name.charAt(0))}</div>
                    <div class="chat-meta">
                        <div class="chat-title">${escapeHtml(item.name)}</div>
                        <div class="chat-sub"><span>${item.count}件</span><span>${item.lastTime}</span></div>
                    </div>
                `;
                el.onclick = () => {
                    document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                    activeChat = item;
                    loadMessages(databases.find(d => d.id === item.dbId), item.id, item.name);
                };
                container.appendChild(el);
            });
        }

        function filterChatList(query) {
            const q = query.toLowerCase().trim();
            const filtered = allChatRooms.filter(c => c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
            renderChatList(filtered);
        }

        function loadMessages(dbObj, chatId, chatName) {
            updateStatus(`メッセージ読み込み中...`);
            const { db, schema: sch, userMap } = dbObj;
            const safeId = String(chatId).replace(/'/g, "''");

            const query = `
                SELECT "${sch.textCol}", ${sch.isMeCol ? `"${sch.isMeCol}"` : 'NULL'}, "${sch.senderCol}", "${sch.timeCol}", "${sch.typeCol}"
                FROM "${sch.msgTable}"
                WHERE CAST("${sch.chatCol}" AS TEXT) = '${safeId}'
                ORDER BY "${sch.timeCol}" ASC
            `;

            let res;
            try { res = db.exec(query)[0]; } catch(e) { alert('取得失敗: ' + e.message); return; }
            if (!res || !res.values) return;

            rawMessages = res.values.map((r) => {
                const rawText = r[0] || '';
                const isMeVal = r[1];
                const senderId = String(r[2] || '');
                const rawTime = r[3];
                const type = r[4];

                let isMe = false;
                if (sch.myMid && senderId === sch.myMid) {
                    isMe = true;
                } else if (isMeVal !== null && isMeVal !== undefined) {
                    isMe = (Number(isMeVal) === 1 || isMeVal === true || String(isMeVal) === '1' || Number(isMeVal) === 2);
                } else {
                    isMe = (!senderId || senderId === '0' || senderId === '');
                }

                let senderName = isMe ? '自分' : (userMap[senderId] || chatName);
                let text = rawText || `[メディア: タイプ${type}]`;
                const dateObj = parseTimestamp(rawTime);

                return {
                    text, isMe, senderName,
                    dateStr: dateObj ? formatDateHeader(dateObj) : '',
                    timeStr: dateObj ? formatTime(dateObj) : '',
                    timestamp: dateObj ? dateObj.getTime() : 0
                };
            });

            renderMessagesUI();
        }

        function renderMessagesUI() {
            const view = document.getElementById('chat-view');
            document.getElementById('empty-state').style.display = 'none';

            let msgContainer = document.getElementById('messages-container');
            if (!msgContainer) {
                msgContainer = document.createElement('div');
                msgContainer.id = 'messages-container';
                view.appendChild(msgContainer);
            }
            msgContainer.innerHTML = '';

            let lastDateStr = '';
            rawMessages.forEach(m => {
                if (m.dateStr && m.dateStr !== lastDateStr) {
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date-divider';
                    dateDiv.innerText = m.dateStr;
                    msgContainer.appendChild(dateDiv);
                    lastDateStr = m.dateStr;
                }

                const row = document.createElement('div');
                row.className = `msg-row ${m.isMe ? 'me' : 'other'}`;
                row.innerHTML = `
                    ${!m.isMe ? `<div class="msg-avatar">${escapeHtml(m.senderName.charAt(0))}</div>` : ''}
                    <div class="msg-content">
                        <div class="msg-sender-name">${escapeHtml(m.senderName)}</div>
                        <div class="msg-body-wrap">
                            <div class="bubble">${escapeHtml(m.text)}</div>
                            <div class="msg-time">${m.timeStr}</div>
                        </div>
                    </div>
                `;
                msgContainer.appendChild(row);
            });

            updateStatus(`表示完了: ${activeChat.name} (${rawMessages.length}件)`);
            view.scrollTop = view.scrollHeight;
        }

        function parseTimestamp(ts) {
            if (!ts) return null;
            let num = Number(ts);
            if (isNaN(num) || num === 0) return null;
            if (num > 1000000000000) return new Date(num);
            if (num > 100000000) return new Date(num * 1000);
            return new Date(num);
        }
        function formatDateHeader(d) { return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; }
        function formatTime(d) { return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
        function formatDate(d) { return `${d.getMonth() + 1}/${d.getDate()} ${formatTime(d)}`; }
        function escapeHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    </script>
</body>
</html>
