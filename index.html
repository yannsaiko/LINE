<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Talk History Multi-Viewer & AI Analysis</title>
    <style>
        :root {
            --primary-color: #06c755;
            --primary-dark: #05b34c;
            --bg-color: #f1f5f9;
            --sidebar-bg: #ffffff;
            --chat-bg: #8cabd9;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
            --bubble-self: #85e249;
            --bubble-other: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--text-main); background: var(--bg-color); height: 100vh; overflow: hidden; }

        .app-layout { display: flex; height: 100vh; width: 100vw; }

        /* サイドバー */
        .sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .sidebar-title { font-size: 16px; font-weight: bold; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        .file-upload-btn { display: block; width: 100%; text-align: center; background: var(--primary-color); color: #fff; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .file-upload-btn:hover { background: var(--primary-dark); }
        .file-upload-btn input { display: none; }

        .search-box { padding: 8px 16px; border-bottom: 1px solid var(--border-color); }
        .input-text { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; outline: none; }
        .input-text:focus { border-color: var(--primary-color); }

        .room-list { flex: 1; overflow-y: auto; }
        .room-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.15s; }
        .room-item:hover { background: #f8fafc; }
        .room-item.active { background: #e2f8eb; border-left: 4px solid var(--primary-color); }
        .room-info { overflow: hidden; }
        .room-name { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .room-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
        .room-count { font-size: 11px; background: #cbd5e1; color: #334155; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        .sidebar-footer { padding: 12px; border-top: 1px solid var(--border-color); background: #f8fafc; }
        .btn-ai-open { width: 100%; padding: 10px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-ai-open:hover { background: #2563eb; }

        /* チャットエリア */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
        .chat-header { height: 60px; background: #ffffff; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .chat-header-title { font-size: 16px; font-weight: bold; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .date-divider { text-align: center; margin: 12px 0; }
        .date-divider span { background: rgba(0,0,0,0.2); color: #fff; font-size: 11px; padding: 4px 12px; border-radius: 12px; }

        .msg-row { display: flex; gap: 8px; max-width: 70%; margin-bottom: 4px; }
        .msg-row.self { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row.other { align-self: flex-start; }

        .msg-sender { font-size: 11px; color: #475569; margin-bottom: 2px; }
        .msg-bubble-wrap { display: flex; items-align: flex-end; gap: 6px; }
        .msg-row.self .msg-bubble-wrap { flex-direction: row-reverse; }

        .msg-bubble { padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; white-space: pre-wrap; position: relative; }
        .msg-row.self .msg-bubble { background: var(--bubble-self); color: #000; border-top-right-radius: 2px; }
        .msg-row.other .msg-bubble { background: var(--bubble-other); color: #000; border-top-left-radius: 2px; }
        .msg-time { font-size: 10px; color: #334155; align-self: flex-end; white-space: nowrap; }

        .empty-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

        /* モーダル */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-body { background: #fff; width: 850px; max-width: 95vw; height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; }
        .modal-title { font-weight: bold; font-size: 16px; }
        .btn-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b; }

        .modal-nav { display: flex; border-bottom: 1px solid var(--border-color); background: #f1f5f9; }
        .modal-nav-item { padding: 12px 20px; font-size: 13px; font-weight: bold; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; }
        .modal-nav-item.active { color: var(--primary-color); border-bottom-color: var(--primary-color); background: #fff; }

        .modal-content-area { flex: 1; overflow-y: auto; padding: 20px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* AIフォーム要素 */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #334155; }
        .radio-group, .checkbox-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .radio-label, .checkbox-label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }

        #ai-room-checklist-wrap { border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; background: #f8fafc; margin-top: 8px; }
        #ai-room-checklist { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .ai-room-item { font-size: 12px; display: flex; align-items: center; justify-content: space-between; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: bold; border: none; cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--primary-color); color: #fff; }
        .btn-secondary { background: #64748b; color: #fff; }
        .btn-small { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; }
        .btn-danger { color: #ef4444; border-color: #fca5a5; }

        #ai-result-container { margin-top: 20px; border-top: 2px dashed var(--border-color); padding-top: 16px; }
        #ai-result-box { background: #f8fafc; border: 1px solid var(--border-color); padding: 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }

        /* 履歴カード */
        .history-card { background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
        .history-card-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
        .history-card-title { font-weight: bold; color: #1e293b; }
        .history-card-date { color: #94a3b8; }
        .history-card-actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- サイドバー -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">💬 LINEマルチビューア</div>
                <label class="file-upload-btn">
                    📁 トーク履歴ファイル追加
                    <input type="file" id="file-input" multiple accept=".txt">
                </label>
            </div>
            <div class="search-box">
                <input type="text" id="room-search" class="input-text" placeholder="トークルームを検索..." oninput="filterRooms(this.value)">
            </div>
            <div class="room-list" id="room-list">
                <div style="padding:20px; text-align:center; color:#94a3b8; font-size:12px;">.txt ファイルを読み込んでください</div>
            </div>
            <div class="sidebar-footer">
                <button class="btn-ai-open" onclick="openAiModal()">🤖 AI分析センター</button>
            </div>
        </div>

        <!-- メインチャット表示領域 -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-header-title" id="chat-header-title">トークルームを選択してください</div>
                <input type="text" id="chat-search" class="input-text" style="width:200px;" placeholder="メッセージ検索..." oninput="renderMessages()">
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="empty-chat">
                    <h2>LINE Talk Viewer</h2>
                    <p style="margin-top:8px; font-size:13px;">左側のリストからトークルームを選択するとメッセージが表示されます</p>
                </div>
            </div>
        </div>
    </div>

    <!-- AI分析モーダル -->
    <div class="modal-overlay" id="ai-modal">
        <div class="modal-body">
            <div class="modal-header">
                <div class="modal-title">🤖 AIトーク履歴分析センター</div>
                <button class="btn-close" onclick="closeAiModal()">&times;</button>
            </div>
            <div class="modal-nav">
                <div class="modal-nav-item active" onclick="switchAiTab('run')" id="tab-nav-run">AI分析実行</div>
                <div class="modal-nav-item" onclick="switchAiTab('history')" id="tab-nav-history">分析履歴 (<span id="ai-history-count">0</span>)</div>
                <div class="modal-nav-item" onclick="switchAiTab('settings')" id="tab-nav-settings">API設定</div>
            </div>
            <div class="modal-content-area">
                
                <!-- Tab 1: AI分析実行 -->
                <div class="tab-pane active" id="tab-pane-run">
                    <div class="form-group">
                        <label class="form-label">1. 分析対象のスコープ</label>
                        <div class="radio-group">
                            <label class="radio-label"><input type="radio" name="ai-target-scope" value="active" checked onchange="toggleAiRoomSelectVisibility()"> 現在表示中のトーク</label>
                            <label class="radio-label"><input type="radio" name="ai-target-scope" value="multiple" onchange="toggleAiRoomSelectVisibility()"> 複数指定</label>
                            <label class="radio-label"><input type="radio" name="ai-target-scope" value="all" onchange="toggleAiRoomSelectVisibility()"> 全トークルーム</label>
                        </div>

                        <div id="ai-room-checklist-wrap" style="display:none;">
                            <div style="display:flex; gap:8px; margin-bottom:6px;">
                                <input type="text" class="input-text" style="padding:4px 8px; font-size:12px;" placeholder="ルーム絞り込み..." oninput="filterAiRoomChecklist(this.value)">
                                <button class="btn-small" onclick="toggleFilteredAiRooms(true)">全選</button>
                                <button class="btn-small" onclick="toggleFilteredAiRooms(false)">解除</button>
                            </div>
                            <div id="ai-room-checklist"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">2. 件数範囲</label>
                        <select id="ai-range-type" class="input-text">
                            <option value="recent100">直近 100 件</option>
                            <option value="recent300" selected>直近 300 件</option>
                            <option value="all">全件（長いトークはAPI制限に注意）</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">3. 分析タイプ</label>
                        <select id="ai-prompt-type" class="input-text" onchange="onAiPromptTypeChange(this.value)">
                            <option value="summary">全体の要約とハイライト</option>
                            <option value="relationship">会話当事者の関係性・親密度の分析</option>
                            <option value="tasks">決定事項・スケジュール・TODOの抽出</option>
                            <option value="custom">自由指定（カスタム質問）</option>
                        </select>
                    </div>

                    <div class="form-group" id="ai-custom-question-group" style="display:none;">
                        <label class="form-label">カスタム質問・指示</label>
                        <textarea id="ai-custom-question" class="input-text" style="height:60px;" placeholder="例: 相手の機嫌が悪くなった原因とタイムラインを分析して"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">4. 使用モデル</label>
                        <select id="ai-model-select" class="input-text">
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash (高速・推奨)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro (高精度)</option>
                        </select>
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="runAiAnalysis()">🚀 AIで分析実行</button>
                        <button class="btn btn-secondary" onclick="copyAiPromptToClipboard()">📋 プロンプトをコピー(外部AI用)</button>
                    </div>

                    <div id="ai-result-container" style="display:none;">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <label class="form-label" style="margin:0;">💡 分析結果</label>
                            <button class="btn-small" onclick="downloadCurrentAiResult()">💾 TXT保存</button>
                        </div>
                        <div id="ai-result-box"></div>
                    </div>
                </div>

                <!-- Tab 2: 履歴 -->
                <div class="tab-pane" id="tab-pane-history">
                    <div id="ai-history-list"></div>
                </div>

                <!-- Tab 3: API設定 -->
                <div class="tab-pane" id="tab-pane-settings">
                    <div class="form-group">
                        <label class="form-label">Gemini API Key</label>
                        <input type="password" id="ai-api-key" class="input-text" placeholder="AIzaSy..." onchange="saveApiKey(this.value)">
                        <small style="color:#64748b; font-size:11px; display:block; margin-top:4px;">Google AI Studioで取得したAPIキーを入力してください。ブラウザ内にのみ保存されます。</small>
                    </div>
                    <button class="btn btn-primary" onclick="verifyApiKey()">🔐 認証確認 & モデル更新</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        /* --- グローバル状態管理 --- */
        let allChatRooms = [];
        let activeChat = null;
        let latestAiResultText = "";
        let aiHistory = [];

        /* --- 初期化 --- */
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('line_viewer_gemini_key') || '';
            document.getElementById('ai-api-key').value = savedKey;
            
            document.getElementById('file-input').addEventListener('change', handleFileSelect);
            loadAiHistoryFromStorage();
        });

        function saveApiKey(val) {
            localStorage.setItem('line_viewer_gemini_key', val.trim());
        }

        async function verifyApiKey() {
            const key = document.getElementById('ai-api-key').value.trim();
            if (!key) {
                alert('APIキーを入力してください。');
                return;
            }
            saveApiKey(key);
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                if (res.ok) {
                    const data = await res.json();
                    const models = data.models.filter(m => m.supportedGenerationMethods?.includes('generateContent'));
                    const select = document.getElementById('ai-model-select');
                    select.innerHTML = '';
                    models.forEach(m => {
                        const mName = m.name.replace('models/', '');
                        const opt = document.createElement('option');
                        opt.value = mName;
                        opt.textContent = `${m.displayName || mName} (${mName})`;
                        if (mName.includes('flash')) opt.selected = true;
                        select.appendChild(opt);
                    });
                    alert('✅ APIキーの認証に成功しました！利用可能なモデルを更新しました。');
                } else {
                    alert('❌ 認証エラー: APIキーが無効であるか、権限がありません。');
                }
            } catch (e) {
                alert(`❌ 通信エラー: ${e.message}`);
            }
        }

        /* --- ファイル読み込み & LINEテキストパース --- */
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    parseLineText(evt.target.result, file.name, `file_${Date.now()}_${index}`);
                    renderRoomList();
                };
                reader.readAsText(file, 'UTF-8');
            });
        }

        function parseLineText(content, fileName, fileId) {
            const lines = content.split(/\r?\n/);
            let roomName = fileName.replace('[LINE]', '').replace('.txt', '').trim();
            let messages = [];
            let currentDateStr = '';

            const dateRegex = /^(\d{4}[\/\.\-]\d{1,2}[\/\.\-]\d{1,2})/;
            const timeMsgRegex = /^(\d{1,2}:\d{2})\t([^\t]+)\t(.*)$/;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (i === 0 && line.includes('LINE')) {
                    roomName = line.replace('[LINE]', '').replace('とのトーク履歴', '').trim();
                    continue;
                }

                const dateMatch = line.match(dateRegex);
                if (dateMatch) {
                    currentDateStr = dateMatch[1].replace(/[\.\-]/g, '/');
                    continue;
                }

                const msgMatch = line.match(timeMsgRegex);
                if (msgMatch && currentDateStr) {
                    const timeStr = msgMatch[1];
                    const sender = msgMatch[2];
                    const text = msgMatch[3];
                    const fullDT = `${currentDateStr} ${timeStr}`;

                    messages.push({
                        id: messages.length,
                        fullDateTimeStr: fullDT,
                        dateStr: currentDateStr,
                        timeStr: timeStr,
                        senderName: sender,
                        text: text,
                        timestamp: parseTimestamp(fullDT)
                    });
                } else if (messages.length > 0 && !line.startsWith('保存日時：')) {
                    // 複数行メッセージの結合
                    messages[messages.length - 1].text += '\n' + line;
                }
            }

            if (messages.length > 0) {
                allChatRooms.push({
                    fileId: fileId,
                    id: `room_${allChatRooms.length}`,
                    name: roomName,
                    displayLabel: fileName,
                    count: messages.length,
                    messages: messages
                });
            }
        }

        async function getRawMessagesForChat(room) {
            return room ? room.messages : [];
        }

        /* --- UIレンダリング --- */
        function renderRoomList(query = '') {
            const container = document.getElementById('room-list');
            container.innerHTML = '';

            const filtered = allChatRooms.filter(r => r.name.toLowerCase().includes(query.toLowerCase()));

            if (filtered.length === 0) {
                container.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8; font-size:12px;">該当するトークはありません</div>';
                return;
            }

            filtered.forEach(room => {
                const div = document.createElement('div');
                div.className = `room-item ${activeChat && activeChat.id === room.id ? 'active' : ''}`;
                div.onclick = () => selectRoom(room);
                div.innerHTML = `
                    <div class="room-info">
                        <div class="room-name">${escapeHtml(room.name)}</div>
                        <div class="room-sub">${escapeHtml(room.displayLabel)}</div>
                    </div>
                    <div class="room-count">${room.count}</div>
                `;
                container.appendChild(div);
            });
        }

        function filterRooms(q) {
            renderRoomList(q);
        }

        function selectRoom(room) {
            activeChat = room;
            renderRoomList(document.getElementById('room-search').value);
            document.getElementById('chat-header-title').innerText = `${room.name} (${room.count}件のメッセージ)`;
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';

            if (!activeChat) {
                container.innerHTML = `<div class="empty-chat"><h2>LINE Talk Viewer</h2><p style="margin-top:8px; font-size:13px;">左側のリストからトークルームを選択してください</p></div>`;
                return;
            }

            const searchQ = document.getElementById('chat-search').value.toLowerCase().trim();
            let lastDate = '';

            const senders = Array.from(new Set(activeChat.messages.map(m => m.senderName)));
            const mainUser = senders[senders.length - 1] || '';

            activeChat.messages.forEach(msg => {
                if (searchQ && !msg.text.toLowerCase().includes(searchQ) && !msg.senderName.toLowerCase().includes(searchQ)) {
                    return;
                }

                if (msg.dateStr !== lastDate) {
                    lastDate = msg.dateStr;
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date-divider';
                    dateDiv.innerHTML = `<span>${formatDateHeader(msg.timestamp || new Date(msg.dateStr))}</span>`;
                    container.appendChild(dateDiv);
                }

                const isSelf = msg.senderName === mainUser;
                const row = document.createElement('div');
                row.className = `msg-row ${isSelf ? 'self' : 'other'}`;
                
                row.innerHTML = `
                    <div>
                        ${!isSelf ? `<div class="msg-sender">${escapeHtml(msg.senderName)}</div>` : ''}
                        <div class="msg-bubble-wrap">
                            <div class="msg-bubble">${escapeHtml(msg.text)}</div>
                            <div class="msg-time">${escapeHtml(msg.timeStr)}</div>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });

            container.scrollTop = container.scrollHeight;
        }

        /* --- AIモーダル操作 --- */
        function openAiModal() {
            document.getElementById('ai-modal').style.display = 'flex';
            renderAiRoomChecklist();
        }

        function closeAiModal() {
            document.getElementById('ai-modal').style.display = 'none';
        }

        function switchAiTab(tab) {
            document.querySelectorAll('.modal-nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-nav-${tab}`)?.classList.add('active');
            document.getElementById(`tab-pane-${tab}`)?.classList.add('active');

            if (tab === 'history') renderAiHistoryList();
        }

        /* --- AI機能（指定ロジック完全統合） --- */
        function renderAiRoomChecklist() {
            const listEl = document.getElementById('ai-room-checklist');
            listEl.innerHTML = '';
            
            allChatRooms.forEach((room) => {
                const roomKey = `${room.fileId}_${room.id}`;
                const div = document.createElement('div');
                div.className = 'ai-room-item';
                div.innerHTML = `
                    <label class="checkbox-label" style="margin:0;">
                        <input type="checkbox" class="ai-room-cb" value="${escapeHtml(roomKey)}" data-fileid="${escapeHtml(room.fileId)}" data-roomid="${escapeHtml(room.id)}">
                        <span>${escapeHtml(room.name)} <small style="color:#64748b;">(${escapeHtml(room.displayLabel)} - ${room.count}件)</small></span>
                    </label>
                `;
                listEl.appendChild(div);
            });
        }

        function toggleAiRoomSelectVisibility() {
            const scope = document.querySelector('input[name="ai-target-scope"]:checked')?.value;
            const wrap = document.getElementById('ai-room-checklist-wrap');
            if (wrap) {
                wrap.style.display = scope === 'multiple' ? 'block' : 'none';
            }
        }

        function filterAiRoomChecklist(query) {
            const q = query.toLowerCase().trim();
            document.querySelectorAll('.ai-room-item').forEach(item => {
                item.style.display = item.textContent.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        }

        function toggleFilteredAiRooms(select) {
            document.querySelectorAll('.ai-room-item').forEach(item => {
                if (item.style.display !== 'none') {
                    const cb = item.querySelector('.ai-room-cb');
                    if (cb) cb.checked = select;
                }
            });
        }

        function onAiPromptTypeChange(val) {
            const customGroup = document.getElementById('ai-custom-question-group');
            if (customGroup) {
                customGroup.style.display = val === 'custom' ? 'block' : 'none';
            }
        }

        async function buildFormattedPrompt() {
            const scope = document.querySelector('input[name="ai-target-scope"]:checked')?.value;
            let targetRooms = [];

            if (scope === 'active') {
                if (!activeChat) {
                    alert('現在開いているトークルームがありません。');
                    return null;
                }
                targetRooms = [activeChat];
            } else if (scope === 'multiple') {
                const selectedCbs = Array.from(document.querySelectorAll('.ai-room-cb:checked'));
                if (selectedCbs.length === 0) {
                    alert('分析対象のトークルームを1つ以上選択してください。');
                    return null;
                }
                targetRooms = selectedCbs.map(cb => {
                    const fId = cb.dataset.fileid;
                    const rId = cb.dataset.roomid;
                    return allChatRooms.find(r => r.fileId === fId && r.id === rId);
                }).filter(Boolean);
            } else if (scope === 'all') {
                targetRooms = [...allChatRooms];
            }

            const rangeType = document.getElementById('ai-range-type').value;
            const promptType = document.getElementById('ai-prompt-type').value;
            const customQuestion = document.getElementById('ai-custom-question').value.trim();

            let promptIntro = "";
            switch (promptType) {
                case 'summary':
                    promptIntro = "以下のLINEトーク履歴を分析し、全体の主要トピック、重要ポイント、やり取りの流れを分かりやすく要約してください。";
                    break;
                case 'relationship':
                    promptIntro = "以下のLINEトーク履歴を分析し、会話当事者同士の感情、関係性の深さ、会話の雰囲気、親密度の変化や注意点について分析してください。";
                    break;
                case 'tasks':
                    promptIntro = "以下のLINEトーク履歴から、決定事項、将来の約束、タスク、スケジュールの決定内容を箇条書きで漏れなく抽出してください。";
                    break;
                case 'custom':
                    promptIntro = customQuestion ? `以下のLINEトーク履歴に基づいて、指示・質問に答えてください：\n【指示】${customQuestion}` : "以下のLINEトーク履歴を詳細に分析してください。";
                    break;
            }

            let fullTextContent = `${promptIntro}\n\n====================\n`;

            for (const room of targetRooms) {
                let msgs = await getRawMessagesForChat(room);
                if (rangeType === 'recent100') msgs = msgs.slice(-100);
                else if (rangeType === 'recent300') msgs = msgs.slice(-300);

                fullTextContent += `【トークルーム: ${room.name} (${room.displayLabel})】\n`;
                msgs.forEach(m => {
                    fullTextContent += `${m.fullDateTimeStr} | ${m.senderName}: ${m.text}\n`;
                });
                fullTextContent += `\n--------------------\n`;
            }

            return fullTextContent;
        }

        async function runAiAnalysis() {
            const apiKey = document.getElementById('ai-api-key').value.trim();
            const model = document.getElementById('ai-model-select').value;
            
            if (!apiKey) {
                alert('APIキーを入力してください。');
                return;
            }
            if (!model) {
                alert('認証確認を行って有効なAIモデルを選択してください。');
                return;
            }

            const promptText = await buildFormattedPrompt();
            if (!promptText) return;

            const resultContainer = document.getElementById('ai-result-container');
            const resultBox = document.getElementById('ai-result-box');
            resultContainer.style.display = 'block';
            resultBox.innerText = '🤖 AIがトーク履歴を分析中... しばらくお待ちください。';

            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || '結果を取得できませんでした。';
                    latestAiResultText = aiReply;
                    resultBox.innerText = aiReply;

                    saveToHistory({
                        id: Date.now(),
                        date: new Date().toLocaleString('ja-JP'),
                        target: activeChat ? activeChat.name : '複数トーク',
                        promptType: document.getElementById('ai-prompt-type').value,
                        result: aiReply
                    });
                } else {
                    const err = await response.json().catch(() => ({}));
                    resultBox.innerText = `❌ 分析エラー: ${err.error?.message || response.statusText}`;
                }
            } catch (err) {
                resultBox.innerText = `❌ 通信エラー: ${err.message}`;
            }
        }

        async function copyAiPromptToClipboard() {
            const promptText = await buildFormattedPrompt();
            if (!promptText) return;
            try {
                await navigator.clipboard.writeText(promptText);
                alert('プロンプトとトーク履歴をクリップボードにコピーしました！ ChatGPT や Claude などの外部AIに貼り付けてご利用いただけます。');
            } catch (e) {
                alert('コピーに失敗しました。手動でテキストを選択してください。');
            }
        }

        function downloadCurrentAiResult() {
            if (!latestAiResultText) {
                alert('保存するAI分析結果がありません。');
                return;
            }
            const blob = new Blob([latestAiResultText], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `LINE_AI_Analysis_${new Date().toISOString().slice(0, 10)}.txt`;
            a.click();
        }

        /* --- 履歴管理機能 --- */

        function loadAiHistoryFromStorage() {
            try {
                const stored = localStorage.getItem('line_viewer_ai_history');
                if (stored) aiHistory = JSON.parse(stored);
            } catch (e) { aiHistory = []; }
            updateHistoryCount();
        }

        function saveAiHistoryToStorage() {
            try {
                localStorage.setItem('line_viewer_ai_history', JSON.stringify(aiHistory));
            } catch (e) {}
            updateHistoryCount();
        }

        function saveToHistory(item) {
            aiHistory.unshift(item);
            if (aiHistory.length > 20) aiHistory.pop();
            saveAiHistoryToStorage();
        }

        function updateHistoryCount() {
            const countEl = document.getElementById('ai-history-count');
            if (countEl) countEl.innerText = aiHistory.length;
        }

        function renderAiHistoryList() {
            const listEl = document.getElementById('ai-history-list');
            listEl.innerHTML = '';

            if (aiHistory.length === 0) {
                listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#888; font-size:13px;">保存された分析履歴はありません</div>';
                return;
            }

            aiHistory.forEach(item => {
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-card-header">
                        <span class="history-card-title">🎯 ${escapeHtml(item.target)} (${getPromptTypeName(item.promptType)})</span>
                        <span class="history-card-date">${escapeHtml(item.date)}</span>
                    </div>
                    <div style="font-size:12px; color:#334155; white-space:pre-wrap; max-height:80px; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(item.result)}</div>
                    <div class="history-card-actions">
                        <button class="btn-small" onclick="viewAiHistoryItem(${item.id})">🔍 表示・使用</button>
                        <button class="btn-small btn-danger" onclick="deleteAiHistoryItem(${item.id})">🗑️ 削除</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function getPromptTypeName(type) {
            switch (type) {
                case 'summary': return '要約';
                case 'relationship': return '関係性分析';
                case 'tasks': return '決定事項抽出';
                case 'custom': return '自由質問';
                default: return '分析';
            }
        }

        function viewAiHistoryItem(id) {
            const item = aiHistory.find(h => h.id === id);
            if (item) {
                latestAiResultText = item.result;
                switchAiTab('run');
                const resultContainer = document.getElementById('ai-result-container');
                const resultBox = document.getElementById('ai-result-box');
                resultContainer.style.display = 'block';
                resultBox.innerText = item.result;
            }
        }

        function deleteAiHistoryItem(id) {
            aiHistory = aiHistory.filter(h => h.id !== id);
            saveAiHistoryToStorage();
            renderAiHistoryList();
        }

        /* --- ユーティリティ関数 --- */

        function parseTimestamp(ts) {
            if (!ts) return null;
            if (typeof ts === 'number' || !isNaN(Number(ts))) {
                let num = Number(ts);
                if (num > 1e11 && num < 1e13) return new Date(num);
                if (num < 1e11) return new Date(num * 1000);
                if (num > 1e15) return new Date((num / 1000000000) - 11644473600);
            }
            const d = new Date(ts);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatDate(d) {
            if (!(d instanceof Date) || isNaN(d.getTime())) return '';
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}/${m}/${day}`;
        }

        function formatTime(d) {
            if (!(d instanceof Date) || isNaN(d.getTime())) return '';
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            return `${h}:${m}`;
        }

        function formatDateHeader(d) {
            if (!(d instanceof Date) || isNaN(d.getTime())) return '日時不明';
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${days[d.getDay()]})`;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
