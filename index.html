<script>
        const workerCode = `
            importScripts('https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js');

            let db = null;
            let schema = null;
            let userMap = {};
            let chatMap = {};

            self.onmessage = async function(e) {
                const { action, payload } = e.data;

                if (action === 'init') {
                    try {
                        const SQL = await initSqlJs({
                            locateFile: file => \`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/\${file}\`
                        });
                        self.postMessage({ action: 'ready' });
                    } catch (err) {
                        self.postMessage({ action: 'error', error: 'WebWorker初期化エラー: ' + err.message });
                    }
                } 
                else if (action === 'loadDB') {
                    try {
                        const { mainBuf, walBuf } = payload;
                        const SQL = await initSqlJs({
                            locateFile: file => \`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/\${file}\`
                        });
                        
                        db = new SQL.Database(new Uint8Array(mainBuf));

                        if (walBuf) {
                            try {
                                db.register_via_offset && db.register_via_offset('db-wal', new Uint8Array(walBuf));
                                db.exec("PRAGMA wal_checkpoint(FULL);");
                            } catch(wErr) {}
                        }

                        schema = detectSchema(db);
                        if (!schema.msgTable) {
                            throw new Error("有効なLINEデータベース構造が見つかりませんでした。");
                        }

                        loadDictionaries(db, schema);
                        const chatRooms = fetchChatRooms(db, schema);

                        self.postMessage({ action: 'dbLoaded', payload: { schemaType: schema.type, chatRooms } });
                    } catch (err) {
                        self.postMessage({ action: 'error', error: err.message });
                    }
                }
                else if (action === 'getMessages') {
                    try {
                        const { chatId, chatName } = payload;
                        const result = fetchAllMessages(db, schema, chatId, chatName);
                        self.postMessage({ action: 'messagesLoaded', payload: result });
                    } catch (err) {
                        self.postMessage({ action: 'error', error: err.message });
                    }
                }
            };

            function detectSchema(db) {
                const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table'")[0]?.values.map(r => r[0]) || [];
                
                if (tables.includes('ZMESSAGE')) {
                    const cols = db.exec("PRAGMA table_info(ZMESSAGE)")[0].values.map(c => c[1]);
                    const pkCol = cols.find(c => /^Z_PK$/i.test(c)) || 'ROWID';
                    return {
                        type: 'iOS',
                        msgTable: 'ZMESSAGE',
                        pkCol: pkCol,
                        chatCol: cols.find(c => /^ZCHAT$/i.test(c)) || 'ZCHAT',
                        textCol: cols.find(c => /^ZTEXT$/i.test(c)) || 'ZTEXT',
                        timeCol: cols.find(c => /^ZCREATEDTIME$/i.test(c)) || 'ZCREATEDTIME',
                        isMeCol: cols.find(c => /^ZISFROMME$/i.test(c)) || 'ZISFROMME',
                        senderCol: cols.find(c => /^ZSENDER$/i.test(c)) || 'ZSENDER',
                        typeCol: cols.find(c => /^ZCONTENTTYPE$/i.test(c)) || 'ZCONTENTTYPE',
                        userTable: tables.includes('ZUSER') ? 'ZUSER' : null,
                        chatTable: tables.includes('ZCHAT') ? 'ZCHAT' : null
                    };
                }
                else if (tables.includes('chat_history')) {
                    const cols = db.exec("PRAGMA table_info(chat_history)")[0].values.map(c => c[1]);
                    const pkCol = cols.find(c => /^id$/i.test(c) || /^_id$/i.test(c)) || 'ROWID';
                    return {
                        type: 'Android',
                        msgTable: 'chat_history',
                        pkCol: pkCol,
                        chatCol: cols.find(c => /chat_id/i.test(c)) || 'chat_id',
                        textCol: cols.find(c => /content/i.test(c)) || 'content',
                        timeCol: cols.find(c => /created_time/i.test(c)) || 'created_time',
                        isMeCol: cols.find(c => /is_sent|status/i.test(c)) || null,
                        senderCol: cols.find(c => /from_mid/i.test(c)) || 'from_mid',
                        typeCol: cols.find(c => /attachement_type|type/i.test(c)) || 'type',
                        userTable: tables.includes('contacts') ? 'contacts' : null,
                        chatTable: tables.includes('chat') ? 'chat' : null
                    };
                }
                return {};
            }

            function loadDictionaries(db, sch) {
                userMap = {};
                chatMap = {};

                if (sch.userTable) {
                    try {
                        const res = db.exec(\`SELECT * FROM "\${sch.userTable}"\`)[0];
                        if (res) {
                            const cols = res.columns.map(c => c.toUpperCase());
                            const pkIdx = cols.findIndex(c => c === 'Z_PK' || c === 'ROWID' || c === 'ID');
                            const midIdx = cols.findIndex(c => c.includes('MID'));

                            const nameCandidates = ['ZCUSTOMNAME', 'CUSTOM_NAME', 'ZNAME', 'NAME', 'ZDISPLAYNAME', 'DISPLAY_NAME']
                                .map(colName => cols.indexOf(colName))
                                .filter(idx => idx !== -1);

                            res.values.forEach(r => {
                                let name = null;
                                for (let idx of nameCandidates) {
                                    if (r[idx] !== null && r[idx] !== undefined && String(r[idx]).trim() !== '') {
                                        name = String(r[idx]).trim();
                                        break;
                                    }
                                }

                                if (name) {
                                    if (pkIdx !== -1 && r[pkIdx] !== null) userMap[String(r[pkIdx])] = name;
                                    if (midIdx !== -1 && r[midIdx] !== null) userMap[String(r[midIdx])] = name;
                                }
                            });
                        }
                    } catch(e){}
                }

                if (sch.chatTable) {
                    try {
                        const res = db.exec(\`SELECT * FROM "\${sch.chatTable}"\`)[0];
                        if (res) {
                            const cols = res.columns.map(c => c.toUpperCase());
                            const pkIdx = cols.findIndex(c => c === 'Z_PK' || c === 'ROWID' || c === 'CHAT_ID' || c === 'ID');
                            const midIdx = cols.findIndex(c => c.includes('MID'));

                            const nameCandidates = ['ZNAME', 'NAME', 'TITLE', 'ZCUSTOMNAME', 'CUSTOM_NAME']
                                .map(colName => cols.indexOf(colName))
                                .filter(idx => idx !== -1);

                            res.values.forEach(r => {
                                let name = null;
                                for (let idx of nameCandidates) {
                                    if (r[idx] !== null && r[idx] !== undefined && String(r[idx]).trim() !== '') {
                                        name = String(r[idx]).trim();
                                        break;
                                    }
                                }

                                const pk = (pkIdx !== -1 && r[pkIdx] !== null) ? String(r[pkIdx]) : null;
                                const mid = (midIdx !== -1 && r[midIdx] !== null) ? String(r[midIdx]) : null;

                                if (name) {
                                    if (pk) chatMap[pk] = name;
                                    if (mid) chatMap[mid] = name;
                                } else if (mid && userMap[mid]) {
                                    if (pk) chatMap[pk] = userMap[mid];
                                    chatMap[mid] = userMap[mid];
                                }
                            });
                        }
                    } catch(e){}
                }
            }

            function fetchChatRooms(db, sch) {
                const query = \`
                    SELECT "\${sch.chatCol}", COUNT(*), MAX("\${sch.timeCol}")
                    FROM "\${sch.msgTable}"
                    WHERE "\${sch.chatCol}" IS NOT NULL AND "\${sch.chatCol}" != ''
                    GROUP BY "\${sch.chatCol}"
                    ORDER BY 3 DESC
                \`;
                const res = db.exec(query)[0];
                if (!res || !res.values) return [];

                return res.values.map(r => {
                    const id = String(r[0]);
                    let name = chatMap[id] || userMap[id];
                    
                    if (!name || name.trim() === '') {
                        try {
                            const senderRes = db.exec(\`
                                SELECT "\${sch.senderCol}" FROM "\${sch.msgTable}" 
                                WHERE CAST("\${sch.chatCol}" AS TEXT) = '\${id.replace(/'/g, "''")}' 
                                  AND "\${sch.senderCol}" IS NOT NULL 
                                  AND "\${sch.senderCol}" != ''
                                LIMIT 10
                            \`)[0];
                            if (senderRes && senderRes.values) {
                                for (let s of senderRes.values) {
                                    const sId = String(s[0]);
                                    if (userMap[sId]) { name = userMap[sId]; break; }
                                }
                            }
                        } catch(e){}
                    }

                    if (!name) name = \`トーク (\${id})\`;

                    const dateObj = parseTimestamp(r[2], sch.type);
                    return { 
                        id, 
                        name, 
                        count: r[1], 
                        lastTime: dateObj ? formatDate(dateObj) : '' 
                    };
                });
            }

            function fetchAllMessages(db, sch, chatId, chatName) {
                const safeId = String(chatId).replace(/'/g, "''");

                // ID完全一致検索＋主キー(ROWID/Z_PK)を並び替えキーに追加して順序崩れを防止
                const query = \`
                    SELECT 
                        "\${sch.textCol}", 
                        \${sch.isMeCol ? \`"\${sch.isMeCol}"\` : 'NULL'}, 
                        "\${sch.senderCol}", 
                        "\${sch.timeCol}", 
                        "\${sch.typeCol}",
                        "\${sch.pkCol}"
                    FROM "\${sch.msgTable}"
                    WHERE CAST("\${sch.chatCol}" AS TEXT) = '\${safeId}'
                    ORDER BY "\${sch.timeCol}" ASC, "\${sch.pkCol}" ASC
                \`;

                const res = db.exec(query)[0];
                if (!res || !res.values) return { messages: [] };

                const fallbackName = (chatName && !chatName.startsWith('トーク (')) ? chatName : '相手';

                let parsedList = res.values.map(r => {
                    const rawText = r[0] || '';
                    const isMeVal = r[1];
                    const senderId = String(r[2] || '');
                    const rawTime = r[3];
                    const type = r[4];
                    const pk = Number(r[5]) || 0;

                    let isMe = false;
                    if (sch.type === 'iOS') {
                        isMe = (isMeVal === 1 || isMeVal === '1' || isMeVal === true);
                    } else {
                        if (isMeVal !== null && isMeVal !== undefined) {
                            isMe = (isMeVal === 1 || isMeVal === '1' || isMeVal === true);
                        } else {
                            isMe = (!senderId || senderId === '0' || senderId === 'null' || senderId === '');
                        }
                    }

                    let senderName = isMe ? '自分' : (userMap[senderId] || fallbackName);
                    let displayText = rawText;
                    let isMedia = false;

                    if (!displayText || displayText.trim() === '') {
                        isMedia = true;
                        displayText = getMediaLabel(type);
                    }

                    const dateObj = parseTimestamp(rawTime, sch.type);
                    const timeMs = dateObj ? dateObj.getTime() : 0;

                    return {
                        text: displayText,
                        isMe,
                        senderName,
                        dateStr: dateObj ? formatDateHeader(dateObj) : '',
                        timeStr: dateObj ? formatTime(dateObj) : '',
                        timestamp: timeMs,
                        pk: pk,
                        isMedia
                    };
                });

                // JavaScript側でもタイムスタンプ＋主キー順に厳密ソート
                parsedList.sort((a, b) => {
                    if (a.timestamp !== b.timestamp) {
                        return a.timestamp - b.timestamp;
                    }
                    return a.pk - b.pk;
                });

                return { messages: parsedList };
            }

            function getMediaLabel(type) {
                switch(Number(type)) {
                    case 1: return '[📷 画像]';
                    case 2: return '[🎥 動画]';
                    case 3: return '[🎙 音声メッセージ]';
                    case 7: return '[📍 位置情報]';
                    case 11: return '[🎨 スタンプ]';
                    case 12: return '[🎴 連絡先]';
                    case 14: return '[📞 通話履歴]';
                    case 15: return '[📎 添付ファイル]';
                    default: return '[添付ファイル/メディア]';
                }
            }

            function parseTimestamp(ts, schemaType) {
                if (!ts) return null;
                let num = Number(ts);
                if (isNaN(num) || num === 0) return null;

                if (schemaType === 'iOS' || num < 1000000000) {
                    num = 978307200000 + (num * 1000);
                } else if (num < 100000000000) {
                    num = num * 1000;
                }

                const d = new Date(num);
                return isNaN(d.getTime()) ? null : d;
            }

            function formatDateHeader(d) {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                return \`\${d.getFullYear()}年\${d.getMonth() + 1}月\${d.getDate()}日(\${days[d.getDay()]})\`;
            }

            function formatTime(d) {
                const hh = String(d.getHours()).padStart(2, '0');
                const mm = String(d.getMinutes()).padStart(2, '0');
                return \`\${hh}:\${mm}\`;
            }

            function formatDate(d) {
                return \`\${d.getMonth() + 1}/\${d.getDate()} \${formatTime(d)}\`;
            }
        `;

        let worker = null;
        let activeChat = null;
        let allChatRooms = [];
        let rawMessages = [];

        function initWorker() {
            const blob = new Blob([workerCode], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                const { action, payload, error } = e.data;

                if (action === 'ready') {
                    updateStatus('準備完了: データベースファイルまたはフォルダをドロップしてください');
                } else if (action === 'error') {
                    alert('エラー: ' + error);
                    updateStatus('エラー発生: ' + error);
                } else if (action === 'dbLoaded') {
                    updateStatus(`解析完了 (検出形式: ${payload.schemaType})`);
                    allChatRooms = payload.chatRooms;
                    renderChatList(allChatRooms);
                    
                    document.getElementById('drop-zone').style.display = 'none';
                    document.getElementById('app-container').style.display = 'flex';
                    document.getElementById('btn-reset').style.display = 'inline-flex';
                } else if (action === 'messagesLoaded') {
                    rawMessages = payload.messages;
                    document.getElementById('filter-panel').style.display = 'flex';
                    applyFilters();
                }
            };

            worker.postMessage({ action: 'init' });
        }

        function updateStatus(text) {
            document.getElementById('status-bar').innerText = text;
        }

        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', async e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            updateStatus('スキャン中...');
            const items = e.dataTransfer.items;
            const files = [];

            if (items) {
                const entries = [];
                for (let i = 0; i < items.length; i++) {
                    const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
                    if (entry) entries.push(entry);
                }
                for (let entry of entries) {
                    await traverseFileTree(entry, files);
                }
            } else {
                files.push(...Array.from(e.dataTransfer.files));
            }

            if (files.length > 0) {
                await processFiles(files);
            }
        });

        async function readAllDirectoryEntries(dirReader) {
            let entries = [];
            let read = async () => {
                let results = await new Promise(resolve => dirReader.readEntries(resolve));
                if (results.length > 0) {
                    entries = entries.concat(results);
                    await read();
                }
            };
            await read();
            return entries;
        }

        async function traverseFileTree(item, fileList) {
            if (item.isFile) {
                return new Promise((resolve) => {
                    item.file(file => { fileList.push(file); resolve(); }, () => resolve());
                });
            } else if (item.isDirectory) {
                const dirReader = item.createReader();
                const entries = await readAllDirectoryEntries(dirReader);
                for (let entry of entries) {
                    await traverseFileTree(entry, fileList);
                }
            }
        }

        document.getElementById('file-input').addEventListener('change', e => processFiles(Array.from(e.target.files)));
        document.getElementById('dir-input').addEventListener('change', e => processFiles(Array.from(e.target.files)));

        async function processFiles(files) {
            updateStatus(`${files.length} 件のファイルからDBを特定中...`);

            let mainFile = files.find(f => f.name.toLowerCase() === 'line.sqlite') ||
                           files.find(f => f.name.toLowerCase() === 'talk.sqlite') ||
                           files.find(f => f.name.toLowerCase().includes('naver_line')) ||
                           files.find(f => f.name.endsWith('.sqlite') || f.name.endsWith('.db'));

            let walFile = files.find(f => f.name.toLowerCase().endsWith('-wal'));

            if (!mainFile) {
                alert('有効なLINEデータベースファイル (Line.sqlite または Talk.sqlite) が見つかりませんでした。');
                updateStatus('エラー: DB未検出');
                return;
            }

            try {
                const mainBuf = await mainFile.arrayBuffer();
                const walBuf = walFile ? await walFile.arrayBuffer() : null;

                worker.postMessage({
                    action: 'loadDB',
                    payload: { mainBuf, walBuf }
                }, [mainBuf, ...(walBuf ? [walBuf] : [])]);
            } catch (err) {
                alert('ファイル読み込み失敗: ' + err.message);
            }
        }

        function renderChatList(list) {
            const container = document.getElementById('chat-list');
            container.innerHTML = '';

            list.forEach(item => {
                const el = document.createElement('div');
                el.className = 'chat-item';
                el.innerHTML = `
                    <div class="avatar">${escapeHtml(item.name.charAt(0))}</div>
                    <div class="chat-meta">
                        <div class="chat-title">${escapeHtml(item.name)}</div>
                        <div class="chat-sub">
                            <span>${item.count} 件</span>
                            <span>${item.lastTime}</span>
                        </div>
                    </div>
                `;
                el.onclick = () => {
                    document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
                    el.classList.add('active');
                    activeChat = item;
                    loadMessages();
                };
                container.appendChild(el);
            });
        }

        function filterChatList(query) {
            const q = query.toLowerCase();
            const filtered = allChatRooms.filter(c => c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q));
            renderChatList(filtered);
        }

        function loadMessages() {
            if (!activeChat) return;
            updateStatus(`読み込み中: ${activeChat.name}...`);
            worker.postMessage({
                action: 'getMessages',
                payload: { chatId: activeChat.id, chatName: activeChat.name }
            });
        }

        function applyFilters() {
            if (!rawMessages) return;

            const keyword = document.getElementById('filter-keyword').value.toLowerCase();
            const senderFilter = document.getElementById('filter-sender').value;
            const typeFilter = document.getElementById('filter-type').value;

            const filtered = rawMessages.filter(m => {
                if (keyword && !m.text.toLowerCase().includes(keyword) && !m.senderName.toLowerCase().includes(keyword)) return false;
                if (senderFilter === 'me' && !m.isMe) return false;
                if (senderFilter === 'other' && m.isMe) return false;
                if (typeFilter === 'text' && m.isMedia) return false;
                if (typeFilter === 'media' && !m.isMedia) return false;
                return true;
            });

            renderMessagesUI(filtered);
        }

        function renderMessagesUI(messages) {
            const view = document.getElementById('chat-view');
            document.getElementById('empty-state').style.display = 'none';

            document.getElementById('btn-export-csv').style.display = 'inline-flex';
            document.getElementById('btn-export-txt').style.display = 'inline-flex';
            document.getElementById('btn-print').style.display = 'inline-flex';

            let msgContainer = document.getElementById('messages-container');
            if (!msgContainer) {
                msgContainer = document.createElement('div');
                msgContainer.id = 'messages-container';
                view.appendChild(msgContainer);
            }
            msgContainer.innerHTML = '';

            let lastDateStr = '';

            messages.forEach(m => {
                if (m.dateStr && m.dateStr !== lastDateStr) {
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date-divider';
                    dateDiv.innerText = m.dateStr;
                    msgContainer.appendChild(dateDiv);
                    lastDateStr = m.dateStr;
                }

                const row = document.createElement('div');
                row.className = `msg-row ${m.isMe ? 'me' : 'other'}`;

                let avatarHtml = !m.isMe ? `<div class="msg-avatar">${escapeHtml(m.senderName.charAt(0))}</div>` : '';
                let senderNameHtml = !m.isMe ? `<div class="msg-sender-name">${escapeHtml(m.senderName)}</div>` : '';

                row.innerHTML = `
                    ${avatarHtml}
                    <div class="msg-content">
                        ${senderNameHtml}
                        <div class="msg-body-wrap">
                            <div class="bubble ${m.isMedia ? 'media-bubble' : ''}">${escapeHtml(m.text)}</div>
                            <div class="msg-time">${m.timeStr}</div>
                        </div>
                    </div>
                `;
                msgContainer.appendChild(row);
            });

            updateStatus(`表示中: ${activeChat.name} (${messages.length} / ${rawMessages.length} 件)`);
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        function exportChatCSV() {
            if (!rawMessages.length || !activeChat) return;
            let csv = "\uFEFF日付,時間,送信者,メッセージ,種別\n";
            rawMessages.forEach(m => {
                csv += `"${m.dateStr}","${m.timeStr}","${m.senderName}","${m.text.replace(/"/g, '""')}","${m.isMedia ? 'メディア' : 'テキスト'}"\n`;
            });
            downloadFile(csv, `${activeChat.name}_トーク履歴.csv`, 'text/csv');
        }

        function exportChatTXT() {
            if (!rawMessages.length || !activeChat) return;
            let txt = `==== ${activeChat.name} トーク履歴 ====\n\n`;
            rawMessages.forEach(m => {
                txt += `[${m.dateStr} ${m.timeStr}] ${m.senderName}:\n${m.text}\n\n`;
            });
            downloadFile(txt, `${activeChat.name}_トーク履歴.txt`, 'text/plain');
        }

        function downloadFile(content, fileName, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = initWorker;
    </script>
