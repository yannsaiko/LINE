<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE トーク・深層解析＆横断検索ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-asm.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
            background-color: #f0f2f5; color: #1c1e21; height: 100vh;
            display: flex; flex-direction: column;
        }
        header {
            background-color: #00c300; color: white; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 18px; margin: 0; }
        .btn {
            border: none; padding: 8px 16px; font-weight: bold; border-radius: 20px;
            cursor: pointer; font-size: 13px;
        }
        .btn-print { background-color: white; color: #00c300; display: none; }
        .btn-reset { background-color: rgba(255,255,255,0.2); color: white; display: none; }

        #drop-zone {
            margin: 30px auto; width: 90%; max-width: 800px; padding: 40px 20px;
            border: 2px dashed #00c300; border-radius: 12px; background: white; text-align: center;
        }
        .file-select-btns { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        .file-btn { background: #00c300; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .file-btn:hover { background: #009900; }
        #drop-zone input { display: none; }

        #status-msg {
            margin: 10px auto; width: 90%; max-width: 800px; font-size: 14px;
            color: #333; text-align: center; line-height: 1.6;
        }

        #app-container { display: none; flex: 1; overflow: hidden; }
        #sidebar {
            width: 380px; background: white; border-right: 1px solid #ddd;
            display: flex; flex-direction: column;
        }

        .section-box { padding: 10px 14px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0; }
        .section-box label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; font-weight: bold; }
        #account-select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #ccc; font-size: 12px; }

        .search-box-container { padding: 10px 14px; background: #eef2f5; border-bottom: 1px solid #e0e0e0; }
        .search-input { width: 100%; padding: 8px 12px; border: 1px solid #00c300; border-radius: 20px; font-size: 13px; outline: none; }

        #file-summary { padding: 8px 14px; background: #f8f9fa; font-size: 11px; color: #333; border-bottom: 1px solid #ddd; }
        .file-badge { display: inline-block; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; color: white; }
        .badge-db { background: #007bff; }
        .badge-wal { background: #e67e22; }

        #chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .chat-item:hover { background-color: #f8f9fa; }
        .chat-item.active { background-color: #e6f9e6; font-weight: bold; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #00c300; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .chat-info-body { flex: 1; min-width: 0; }
        .chat-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-meta { font-size: 11px; color: #777; display: flex; justify-content: space-between; margin-top: 3px; }

        #chat-view { flex: 1; background: #8cabd9; padding: 20px; overflow-y: auto; }
        .chat-header-info { background: white; padding: 16px; border-radius: 8px; border-left: 5px solid #00c300; margin-bottom: 20px; }
        
        .msg-row { display: flex; flex-direction: column; margin-bottom: 16px; }
        .msg-row.me { align-items: flex-end; }
        .msg-row.other { align-items: flex-start; }
        .msg-header-line { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .msg-sender-badge { font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; color: white; }
        .msg-row.me .msg-sender-badge { background: #2b8a3e; }
        .msg-row.other .msg-sender-badge { background: #1864ab; }
        .msg-timestamp { font-size: 11px; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
        .bubble-container { max-width: 88%; display: flex; flex-direction: column; }
        .me .bubble-container { align-items: flex-end; }
        .other .bubble-container { align-items: flex-start; }
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; background: white; }
        .me .bubble { background-color: #85e249; border-top-right-radius: 2px; }
        .other .bubble { background-color: #ffffff; border-top-left-radius: 2px; }

        .wal-warning { background: #fff3cd; border: 1px solid #ffeeba; color: #856404; padding: 8px 12px; font-size: 11px; border-radius: 4px; margin-top: 5px; }
        .error-log { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px; border-radius: 6px; margin-top: 10px; text-align: left; font-size: 12px; font-family: monospace; white-space: pre-wrap; }

        @media print {
            header, #sidebar, .file-select-btns, .wal-warning { display: none !important; }
            #app-container { display: block !important; height: auto !important; }
            #chat-view { background: white !important; color: black !important; padding: 0 !important; overflow: visible !important; }
            .bubble { border: 1px solid #ccc !important; }
            .msg-timestamp { color: #666 !important; text-shadow: none !important; }
        }
    </style>
</head>
<body>

    <header>
        <h1>LINE トーク・深層解析＆全ファイル横断検索ツール</h1>
        <div class="header-actions">
            <button id="btn-reset" class="btn btn-reset" onclick="location.reload()">↺ 最初からやり直す</button>
            <button id="btn-print" class="btn btn-print" onclick="window.print()">🖨 印刷 (PDF保存)</button>
        </div>
    </header>

    <div id="drop-zone">
        <h3>📁 ここに LINE の DB ファイルまたはフォルダをドロップ</h3>
        <p style="color: #666; font-size: 13px;">
            <code>Line.sqlite</code> や <code>P_Line.sqlite</code>、またはバックアップフォルダ全体に対応します
        </p>
        <div class="file-select-btns">
            <label class="file-btn">
                📄 ファイルを選択 (.sqlite)
                <input type="file" id="file-input-single" accept=".sqlite">
            </label>
            <label class="file-btn">
                📁 フォルダを選択
                <input type="file" id="file-input-dir" webkitdirectory directory multiple>
            </label>
        </div>
    </div>
    <div id="status-msg">ライブラリ初期化中...</div>

    <div id="app-container">
        <div id="sidebar">
            <div class="section-box">
                <label for="account-select">🗄 対象データベース切り替え:</label>
                <select id="account-select" onchange="switchAccount(this.value)"></select>
            </div>
            <div class="search-box-container">
                <input type="text" id="global-search-input" class="search-input" placeholder="🔍 名前・ID・トーク本文を即座に検索..." oninput="handleSearchInput(this.value)">
            </div>
            <div id="file-summary"></div>
            <div id="chat-list"></div>
        </div>
        <div id="chat-view">
            <div style="text-align: center; color: #ffffff; margin-top: 50px;">
                左側のリストからトークルームを選択してください
            </div>
        </div>
    </div>

    <script>
        let accounts = [];
        let currentAccount = 'all';
        let allDiscoveredChats = [];
        let currentSearchQuery = '';
        let debugLogs = [];

        let globalUserMap = {};
        let globalChatMap = {};

        let detectedRegistry = { databases: [], walShm: [] };
        let SQL = null;

        const CONTENT_TYPE_MAP = {
            0: '💬 テキスト', 1: '🖼 [画像]', 2: '🎥 [動画]', 3: '🎙 [音声]',
            6: '📞 [通話]', 7: '📍 [位置情報]', 11: '🎨 [スタンプ]', 12: '🎴 [連絡先]', 13: '📓 [ノート]',
            14: '📞 [通話履歴]', 15: '📎 [ファイル]', 16: '🔗 [リンク]', 18: '✨ [アニメスタンプ]'
        };

        initSqlJs().then(sqlEngine => {
            SQL = sqlEngine;
            document.getElementById('status-msg').innerText = '準備完了: ファイルまたはフォルダを選択・ドロップしてください';
        }).catch(err => {
            document.getElementById('status-msg').innerHTML = `<span style="color:red;">初期化エラー: ${err.message}</span>`;
        });

        const dropZone = document.getElementById('drop-zone');
        const fileSingle = document.getElementById('file-input-single');
        const fileDir = document.getElementById('file-input-dir');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
        dropZone.addEventListener('drop', async (e) => {
            e.preventDefault();
            const items = e.dataTransfer.items;
            let filesToProcess = [];
            document.getElementById('status-msg').innerText = 'ファイルを走査中...';

            if (items && items.length > 0) {
                let entryPromises = [];
                for (let i = 0; i < items.length; i++) {
                    const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
                    if (entry) entryPromises.push(traverseFileTree(entry));
                    else {
                        const file = items[i].getAsFile();
                        if (file) filesToProcess.push(file);
                    }
                }
                const nestedFiles = await Promise.all(entryPromises);
                nestedFiles.forEach(arr => filesToProcess.push(...arr));
            } else if (e.dataTransfer.files.length > 0) {
                filesToProcess = Array.from(e.dataTransfer.files);
            }

            if (filesToProcess.length > 0) await handleFiles(filesToProcess);
        });

        fileSingle.addEventListener('change', async (e) => {
            if (e.target.files.length > 0) await handleFiles(Array.from(e.target.files));
        });
        fileDir.addEventListener('change', async (e) => {
            if (e.target.files.length > 0) await handleFiles(Array.from(e.target.files));
        });

        async function traverseFileTree(topEntry) {
            const files = [];
            const queue = [topEntry];
            while (queue.length > 0) {
                const entry = queue.shift();
                if (entry.isFile) {
                    await new Promise((resolve) => {
                        entry.file(f => { files.push(f); resolve(); }, () => resolve());
                    });
                } else if (entry.isDirectory) {
                    const dirReader = entry.createReader();
                    let batch = [];
                    do {
                        batch = await new Promise(res => dirReader.readEntries(e => res(e), () => res([])));
                        for (let child of batch) queue.push(child);
                    } while (batch.length > 0);
                }
            }
            return files;
        }

        async function isSqliteHeader(file) {
            if (file.size < 100) return false;
            try {
                const blobSlice = file.slice(0, 16);
                const arrayBuffer = await blobSlice.arrayBuffer();
                const uInt8Array = new Uint8Array(arrayBuffer);
                const headerStr = String.fromCharCode.apply(null, uInt8Array);
                return headerStr.startsWith('SQLite format 3');
            } catch (e) { return false; }
        }

        async function handleFiles(fileList) {
            if (!SQL) return;
            const statusEl = document.getElementById('status-msg');
            detectedRegistry = { databases: [], walShm: [] };
            accounts = [];
            allDiscoveredChats = [];
            debugLogs = [];

            const totalFiles = fileList.length;

            for (let i = 0; i < totalFiles; i++) {
                const file = fileList[i];
                const name = file.name.toLowerCase();
                const path = file.webkitRelativePath || file.name;
                const sizeMB = (file.size / 1024 / 1024).toFixed(2);

                if (name.endsWith('-wal') || name.endsWith('-shm') || name.endsWith('.wal') || name.endsWith('.shm')) {
                    detectedRegistry.walShm.push({ name: file.name, path, size: `${sizeMB} MB` });
                    continue;
                }

                if (await isSqliteHeader(file)) {
                    try {
                        statusEl.innerText = `データベース解析中: ${file.name} (${sizeMB} MB)...`;
                        await new Promise(r => setTimeout(r, 0));
                        const arrayBuffer = await file.arrayBuffer();
                        const dbInstance = new SQL.Database(new Uint8Array(arrayBuffer));
                        const dbInfo = analyzeDatabase(dbInstance);

                        const accIndex = accounts.length;
                        const accountObj = {
                            id: accIndex,
                            fileName: file.name,
                            filePath: path,
                            fileSize: `${sizeMB} MB`,
                            db: dbInstance,
                            info: dbInfo,
                            pkToMidMap: {},
                            midToPkMap: {}
                        };
                        accounts.push(accountObj);

                        const isValid = !!(dbInfo.msgTable || dbInfo.userTable || dbInfo.chatTable);
                        detectedRegistry.databases.push({ name: file.name, path, size: `${sizeMB} MB`, isValidLineDb: isValid });

                        if (!isValid) {
                            debugLogs.push(`ファイル "${file.name}" はSQLiteですが、LINE関連テーブルが見つかりませんでした。`);
                        }
                    } catch (e) {
                        debugLogs.push(`ファイル "${file.name}" の解析失敗: ${e.message}`);
                    }
                }
            }

            if (accounts.length === 0) {
                let logHtml = debugLogs.length > 0 ? `<div class="error-log"><strong>【詳細ログ】</strong><br>${debugLogs.join('<br>')}</div>` : '';
                statusEl.innerHTML = `
                    <span style="color:red; font-weight:bold; font-size:15px;">有効な LINE データベースが見つかりませんでした。</span>
                    <p style="font-size:12px; color:#555; margin-top:8px;">
                        ※ 選択したファイルが Line.sqlite や P_Line.sqlite であるか確認してください。
                    </p>
                    ${logHtml}`;
                return;
            }

            buildGlobalDictionaries();
            extractChatsFromAllAccounts();

            dropZone.style.display = 'none';
            statusEl.style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            document.getElementById('btn-print').style.display = 'block';
            document.getElementById('btn-reset').style.display = 'block';

            renderRegistrySummary();

            const selectEl = document.getElementById('account-select');
            selectEl.innerHTML = accounts.length > 1 ? '<option value="all">全ファイルを統合して表示</option>' : '';
            accounts.forEach((acc, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${acc.fileName} (${acc.fileSize})`;
                selectEl.appendChild(option);
            });

            currentAccount = (accounts.length > 1) ? 'all' : 0;
            selectEl.value = currentAccount;

            renderChatList();
        }

        function renderRegistrySummary() {
            const summaryEl = document.getElementById('file-summary');
            let walWarn = detectedRegistry.walShm.length > 0 
                ? `<div class="wal-warning">⚠️ WAL差分データ (${detectedRegistry.walShm.length}件) が含まれています。最新情報が表示されない場合は事前統合を行ってください。</div>` 
                : '';

            summaryEl.innerHTML = `
                <div style="font-weight:bold; margin-bottom:4px; color:#111;">🔍 検知されたファイル:</div>
                <div><span class="file-badge badge-db">DB</span> ${detectedRegistry.databases.filter(d=>d.isValidLineDb).length}件 | <span class="file-badge badge-wal">WAL</span> ${detectedRegistry.walShm.length}件</div>
                ${walWarn}
            `;
        }

        function analyzeDatabase(db) {
            let info = { 
                allTables: [],
                msgTable: null, msgCols: [], textCols: [], timeCol: null, isMeCol: null, chatCol: null, senderCol: null, typeCol: null,
                chatTable: null, userTable: null
            };

            try {
                const res = db.exec("SELECT name FROM sqlite_master WHERE type IN ('table', 'view')");
                if (!res.length) return info;
                info.allTables = res[0].values.map(r => r[0]);

                const findTable = (candidates) => {
                    for (let cand of candidates) {
                        let match = info.allTables.find(t => t.toUpperCase() === cand.toUpperCase());
                        if (match) return match;
                    }
                    for (let cand of candidates) {
                        let match = info.allTables.find(t => t.toUpperCase().includes(cand.toUpperCase()));
                        if (match) return match;
                    }
                    return null;
                };

                info.msgTable = findTable(['ZMESSAGE', 'Z_MESSAGE', 'CHAT_HISTORY', 'MESSAGES', 'MESSAGE', 'TALK_HISTORY']);
                info.chatTable = findTable(['ZCHAT', 'Z_CHAT', 'CHATS', 'CHAT_ROOMS', 'ROOMS', 'CHAT']);
                info.userTable = findTable(['ZUSER', 'Z_USER', 'ZCONTACT', 'Z_CONTACT', 'USERS', 'CONTACTS', 'FRIENDS', 'ZPROFILE', 'PROFILE']);

                if (info.msgTable) {
                    const colsRes = db.exec(`PRAGMA table_info("${info.msgTable}")`);
                    if (colsRes.length) {
                        info.msgCols = colsRes[0].values.map(c => c[1]);
                        const cUpper = info.msgCols.map(c => c.toUpperCase());

                        const findCol = (candidates) => {
                            for (let cand of candidates) {
                                let idx = cUpper.indexOf(cand.toUpperCase());
                                if (idx !== -1) return info.msgCols[idx];
                            }
                            for (let cand of candidates) {
                                let match = info.msgCols.find(c => c.toUpperCase().includes(cand.toUpperCase()));
                                if (match) return match;
                            }
                            return null;
                        };

                        info.textCols = info.msgCols.filter(c => 
                            /^(ZTEXT|ZCONTENT|ZBODY|TEXT|CONTENT|BODY|ZMESSAGE_TEXT|ZEXTRA|ZPARAMETER)$/i.test(c) || 
                            /TEXT|CONTENT|BODY/i.test(c)
                        );
                        info.timeCol = findCol(['ZCREATEDTIME', 'CREATED_TIME', 'ZTIMESTAMP', 'TIMESTAMP', 'TIME', 'DATE', 'ZDATE']);
                        info.isMeCol = findCol(['ZISFROMME', 'ZIS_FROM_ME', 'IS_ME', 'ISME', 'IS_OUT', 'FROM_ME']);
                        info.chatCol = findCol(['ZCHAT', 'CHAT_ID', 'ZCHAT_ID', 'ROOM_ID', 'CHAT', 'ZADDRESSBOOKID']);
                        info.senderCol = findCol(['ZSENDER', 'SENDER_MID', 'ZSENDER_MID', 'SENDER_ID', 'FROM_MID', 'SENDER']);
                        info.typeCol = findCol(['ZCONTENTTYPE', 'ZTYPE', 'CONTENT_TYPE', 'TYPE', 'CTYPE']);
                    }
                }
            } catch (e) { console.error("DB構造解析エラー:", e); }
            return info;
        }

        function buildGlobalDictionaries() {
            globalUserMap = {};
            globalChatMap = {};

            accounts.forEach(acc => {
                const { db, info } = acc;
                const userTables = info.allTables.filter(t => 
                    /^(ZUSER|Z_USER|ZCONTACT|Z_CONTACT|USERS|CONTACTS|FRIENDS|ZPROFILE|PROFILE)$/i.test(t) ||
                    /USER|CONTACT|FRIEND/i.test(t)
                );

                userTables.forEach(tableName => {
                    try {
                        const colsRes = db.exec(`PRAGMA table_info("${tableName}")`);
                        if (!colsRes.length) return;
                        const cols = colsRes[0].values.map(c => c[1]);
                        const cUpper = cols.map(c => c.toUpperCase());

                        const res = db.exec(`SELECT * FROM "${tableName}"`);
                        if (!res.length || !res[0].values) return;

                        const nameCols = ['ZCUSTOMNAME', 'ZNAME', 'ZDISPLAYNAME', 'ZNICKNAME', 'CUSTOM_NAME', 'NAME', 'DISPLAY_NAME', 'SERVER_NAME'];
                        const idCols = ['ZMID', 'Z_PK', 'ROWID', 'MID', 'ZUSERID', 'M_ID', 'ID', 'USER_ID'];

                        res[0].values.forEach(row => {
                            let name = '';
                            for (let nc of nameCols) {
                                let idx = cUpper.indexOf(nc);
                                if (idx !== -1 && row[idx] && String(row[idx]).trim() !== '') {
                                    name = String(row[idx]).trim();
                                    break;
                                }
                            }
                            if (!name) return;

                            idCols.forEach(ic => {
                                let idx = cUpper.indexOf(ic);
                                if (idx !== -1 && row[idx] !== null && row[idx] !== undefined) {
                                    const val = String(row[idx]).trim();
                                    if (val) globalUserMap[val] = name;
                                }
                            });
                        });
                    } catch (e) {}
                });
            });

            accounts.forEach(acc => {
                const { db, info } = acc;
                const chatTables = info.allTables.filter(t => 
                    /^(ZCHAT|Z_CHAT|CHATS|CHAT_ROOMS|ROOMS|CHAT)$/i.test(t) ||
                    /CHAT/i.test(t)
                );

                chatTables.forEach(tableName => {
                    try {
                        const colsRes = db.exec(`PRAGMA table_info("${tableName}")`);
                        if (!colsRes.length) return;
                        const cols = colsRes[0].values.map(c => c[1]);
                        const cUpper = cols.map(c => c.toUpperCase());

                        const res = db.exec(`SELECT * FROM "${tableName}"`);
                        if (!res.length || !res[0].values) return;

                        const pkIdx = cUpper.indexOf('Z_PK') !== -1 ? cUpper.indexOf('Z_PK') : cUpper.indexOf('ROWID');
                        const midIdx = cUpper.indexOf('ZMID') !== -1 ? cUpper.indexOf('ZMID') : cUpper.indexOf('MID');

                        const nameCols = ['ZNAME', 'ZTITLE', 'NAME', 'TITLE', 'CHAT_NAME'];
                        const idCols = ['Z_PK', 'ROWID', 'ZMID', 'MID', 'ZCHATID', 'CHAT_ID'];
                        const midCols = ['ZMID', 'MID', 'ZADDRESSBOOKID', 'ZUSER', 'ZOWNER'];

                        res[0].values.forEach(row => {
                            let pkVal = pkIdx !== -1 ? String(row[pkIdx]) : null;
                            let midVal = midIdx !== -1 ? String(row[midIdx]) : null;

                            if (pkVal && midVal) {
                                acc.pkToMidMap[pkVal] = midVal;
                                acc.midToPkMap[midVal] = pkVal;
                            }

                            let chatName = '';
                            for (let nc of nameCols) {
                                let idx = cUpper.indexOf(nc);
                                if (idx !== -1 && row[idx] && String(row[idx]).trim() !== '') {
                                    chatName = String(row[idx]).trim();
                                    break;
                                }
                            }

                            if (!chatName) {
                                for (let mc of midCols) {
                                    let idx = cUpper.indexOf(mc);
                                    if (idx !== -1 && row[idx]) {
                                        let mVal = String(row[idx]).trim();
                                        if (globalUserMap[mVal]) {
                                            chatName = globalUserMap[mVal];
                                            break;
                                        }
                                    }
                                }
                            }

                            idCols.forEach(ic => {
                                let idx = cUpper.indexOf(ic);
                                if (idx !== -1 && row[idx] !== null && row[idx] !== undefined) {
                                    const val = String(row[idx]).trim();
                                    if (val) {
                                        if (chatName) globalChatMap[val] = chatName;
                                        else if (globalUserMap[val]) globalChatMap[val] = globalUserMap[val];
                                    }
                                }
                            });
                        });
                    } catch (e) {}
                });
            });
        }

        function resolveChatName(chatId) {
            const key = String(chatId).trim();
            if (globalChatMap[key]) return globalChatMap[key];
            if (globalUserMap[key]) return globalUserMap[key];
            return `トークルーム (ID: ${key})`;
        }

        function extractChatsFromAllAccounts() {
            allDiscoveredChats = [];

            accounts.forEach(acc => {
                const { db, info, id, fileName } = acc;
                if (!info.msgTable) return;

                try {
                    const chatCol = info.chatCol || 'ZCHAT';
                    const timeCol = info.timeCol || 'ROWID';

                    const query = `
                        SELECT 
                            m."${chatCol}" as chat_id,
                            COUNT(m.rowid) as msg_count,
                            MAX(m."${timeCol}") as last_time
                        FROM "${info.msgTable}" m
                        WHERE m."${chatCol}" IS NOT NULL
                        GROUP BY m."${chatCol}"
                    `;

                    const res = db.exec(query);
                    if (res.length && res[0].values) {
                        res[0].values.forEach(row => {
                            const [chatId, count, lastTime] = row;
                            const rawKey = String(chatId).trim();
                            
                            let mappedMid = acc.pkToMidMap[rawKey] || rawKey;
                            let resolvedName = resolveChatName(mappedMid);
                            if (resolvedName.startsWith('トークルーム (ID:')) {
                                resolvedName = resolveChatName(rawKey);
                            }

                            allDiscoveredChats.push({
                                accountId: id,
                                fileName: fileName,
                                chatId: rawKey,
                                mappedMid: mappedMid,
                                chatName: resolvedName,
                                msgCount: count,
                                lastTime: lastTime
                            });
                        });
                    }
                } catch (e) { console.error(`ファイル ${fileName} からのトーク抽出失敗:`, e); }
            });
        }

        function switchAccount(val) {
            currentAccount = (val === 'all') ? 'all' : Number(val);
            renderChatList();
        }

        function handleSearchInput(query) {
            currentSearchQuery = query.trim().toLowerCase();
            renderChatList();
        }

        function normalizeTimestamp(ts) {
            if (!ts || isNaN(ts)) return 0;
            let num = Number(ts);
            if (num <= 0) return 0;

            if (num > 100000000000000) return Math.floor(num / 1000);
            if (num > 100000000000) return num;
            if (num > 100000000) {
                if (num > 1000000000) return num * 1000;
                return 978307200000 + (num * 1000);
            }
            return 978307200000 + (num * 1000);
        }

        function formatTimestamp(ts) {
            if (!ts || isNaN(ts) || ts <= 0) return '';
            const date = new Date(ts);
            if (isNaN(date.getTime())) return '';

            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');

            return `${y}/${m}/${d} ${hh}:${mm}`;
        }

        function escapeHtml(str) {
            if (!str && str !== 0) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function filterChatList(itemList, query) {
            if (!query) return itemList;
            const q = query.toLowerCase();

            return itemList.filter(item => {
                if (item.chatName.toLowerCase().includes(q)) return true;
                if (String(item.chatId).toLowerCase().includes(q)) return true;

                return item.relatedItems.some(rel => {
                    const acc = accounts[rel.accountId];
                    if (acc && acc.info && acc.info.msgTable) {
                        try {
                            const textCols = acc.info.textCols.length > 0 ? acc.info.textCols : ['ZTEXT', 'ZCONTENT', 'ZBODY'];
                            const chatCol = acc.info.chatCol || 'ZCHAT';
                            const safeChatId = String(rel.chatId).replace(/'/g, "''");
                            const safeQ = q.replace(/'/g, "''");
                            
                            if (textCols.length === 0) return false;

                            const clauses = textCols.map(c => `LOWER("${c}") LIKE '%${safeQ}%'`).join(' OR ');
                            const checkSql = `SELECT 1 FROM "${acc.info.msgTable}" WHERE CAST("${chatCol}" AS TEXT) = '${safeChatId}' AND (${clauses}) LIMIT 1`;
                            const checkRes = acc.db.exec(checkSql);
                            return (checkRes.length && checkRes[0].values && checkRes[0].values.length > 0);
                        } catch(e) {}
                    }
                    return false;
                });
            });
        }

        function renderChatList() {
            const chatList = document.getElementById('chat-list');
            chatList.innerHTML = '';

            let itemsToDisplay = [];

            if (currentAccount === 'all' || currentAccount === null) {
                const groups = {};

                allDiscoveredChats.forEach(chat => {
                    let groupKey = chat.mappedMid || chat.chatId;
                    if (!/^[ucg][0-9a-f]{32}$/i.test(groupKey) && chat.chatName && !chat.chatName.startsWith('トークルーム (ID:')) {
                        groupKey = chat.chatName.toLowerCase();
                    }

                    if (!groups[groupKey]) {
                        groups[groupKey] = {
                            groupKey: groupKey,
                            chatName: chat.chatName,
                            chatId: chat.chatId,
                            msgCount: 0,
                            lastTime: 0,
                            relatedItems: []
                        };
                    }

                    groups[groupKey].msgCount += chat.msgCount;
                    if (chat.lastTime > groups[groupKey].lastTime) {
                        groups[groupKey].lastTime = chat.lastTime;
                        if (!groups[groupKey].chatName.startsWith('トークルーム') || chat.chatName) {
                            groups[groupKey].chatName = chat.chatName;
                        }
                    }
                    groups[groupKey].relatedItems.push(chat);
                });

                itemsToDisplay = Object.values(groups);
            } else {
                const targetAccId = Number(currentAccount);
                itemsToDisplay = allDiscoveredChats
                    .filter(c => c.accountId === targetAccId)
                    .map(c => ({
                        groupKey: c.chatId,
                        chatName: c.chatName,
                        chatId: c.chatId,
                        msgCount: c.msgCount,
                        lastTime: c.lastTime,
                        relatedItems: [c]
                    }));
            }

            if (currentSearchQuery !== '') {
                itemsToDisplay = filterChatList(itemsToDisplay, currentSearchQuery);
            }

            itemsToDisplay.sort((a, b) => b.lastTime - a.lastTime);

            if (itemsToDisplay.length === 0) {
                chatList.innerHTML = `<div style="padding:20px; color:#888; font-size:12px; text-align:center;">
                    ${currentSearchQuery ? `「${escapeHtml(currentSearchQuery)}」に一致するトークは見つかりませんでした` : 'トークデータが見つかりません'}
                </div>`;
                return;
            }

            itemsToDisplay.forEach(itemData => {
                const initial = (itemData.chatName || '?').charAt(0).toUpperCase();

                const item = document.createElement('div');
                item.className = 'chat-item';

                let sourceBadge = '';
                if (currentAccount === 'all') {
                    const fileNames = Array.from(new Set(itemData.relatedItems.map(i => i.fileName)));
                    sourceBadge = fileNames.length > 1 ? `${fileNames.length}ファイル統合` : fileNames[0];
                } else {
                    sourceBadge = itemData.relatedItems[0] ? itemData.relatedItems[0].fileName : '';
                }

                item.innerHTML = `
                    <div class="chat-avatar">${escapeHtml(initial)}</div>
                    <div class="chat-info-body">
                        <div class="chat-name">${escapeHtml(itemData.chatName)}</div>
                        <div class="chat-meta">
                            <span>${itemData.msgCount} 件のメッセージ</span>
                            <span style="font-size:10px; background:#e0e0e0; padding:1px 4px; border-radius:3px;">${escapeHtml(sourceBadge)}</span>
                        </div>
                    </div>
                `;

                item.onclick = () => {
                    document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    loadMessagesForChat(itemData, currentAccount);
                };

                chatList.appendChild(item);
            });
        }

        function getMessagesFromAccount(acc, targetChatItem) {
            const { db, info, id, fileName } = acc;
            const messages = [];
            if (!info.msgTable) return { messages: [], error: 'メッセージテーブル未検出' };

            try {
                const chatCol = info.chatCol || 'ZCHAT';
                const timeCol = info.timeCol || 'ROWID';

                let idConditions = [];
                
                if (targetChatItem.chatId) {
                    const safeId = String(targetChatItem.chatId).replace(/'/g, "''");
                    idConditions.push(`CAST("${chatCol}" AS TEXT) = '${safeId}'`);
                }
                
                if (targetChatItem.mappedMid) {
                    const safeMid = String(targetChatItem.mappedMid).replace(/'/g, "''");
                    idConditions.push(`CAST("${chatCol}" AS TEXT) = '${safeMid}'`);
                    if (acc.midToPkMap[targetChatItem.mappedMid]) {
                        idConditions.push(`"${chatCol}" = ${acc.midToPkMap[targetChatItem.mappedMid]}`);
                    }
                }

                const whereClause = idConditions.length > 0 ? `WHERE (${idConditions.join(' OR ')})` : '';
                const query = `SELECT * FROM "${info.msgTable}" ${whereClause} ORDER BY "${timeCol}" ASC`;
                
                const res = db.exec(query);

                if (res.length && res[0].values) {
                    const columns = res[0].columns;
                    const cUpper = columns.map(c => c.toUpperCase());

                    const timeIdx = info.timeCol ? cUpper.indexOf(info.timeCol.toUpperCase()) : -1;
                    const isMeIdx = info.isMeCol ? cUpper.indexOf(info.isMeCol.toUpperCase()) : -1;
                    const senderIdx = info.senderCol ? cUpper.indexOf(info.senderCol.toUpperCase()) : -1;
                    const typeIdx = info.typeCol ? cUpper.indexOf(info.typeCol.toUpperCase()) : -1;

                    const textIndices = [];
                    ['ZTEXT', 'ZCONTENT', 'ZBODY', 'TEXT', 'CONTENT', 'BODY', 'ZMESSAGE_TEXT', 'MESSAGE_TEXT', 'ZEXTRA', 'ZPARAMETER'].forEach(tc => {
                        let idx = cUpper.indexOf(tc);
                        if (idx !== -1 && !textIndices.includes(idx)) textIndices.push(idx);
                    });

                    res[0].values.forEach(row => {
                        let textContent = '';
                        for (let idx of textIndices) {
                            if (row[idx] !== null && row[idx] !== undefined) {
                                const val = row[idx];
                                if (val instanceof Uint8Array) {
                                    textContent = new TextDecoder('utf-8', { fatal: false }).decode(val);
                                } else {
                                    textContent = String(val);
                                }
                                if (textContent.trim() !== '') break;
                            }
                        }

                        let typeVal = typeIdx !== -1 ? row[typeIdx] : null;

                        if (!textContent || textContent.trim() === '') {
                            if (typeVal !== null && CONTENT_TYPE_MAP[typeVal]) {
                                textContent = CONTENT_TYPE_MAP[typeVal];
                            } else {
                                textContent = '[スタンプ / メディア / 暗号化メッセージ]';
                            }
                        } else if (typeVal !== null && typeVal !== 0 && typeVal !== '0') {
                            const typeLabel = CONTENT_TYPE_MAP[typeVal];
                            if (typeLabel && !textContent.startsWith(typeLabel)) {
                                textContent = `${typeLabel}\n${textContent}`;
                            }
                        }

                        let isMe = false;
                        if (isMeIdx !== -1) {
                            let val = row[isMeIdx];
                            isMe = (val === 1 || val === '1' || val === true || String(val).toLowerCase() === 'true');
                        }

                        let senderRaw = senderIdx !== -1 ? row[senderIdx] : null;
                        let senderName = '';
                        if (isMe) {
                            senderName = '自分';
                        } else if (senderRaw !== null && senderRaw !== undefined) {
                            const sStr = String(senderRaw).trim();
                            senderName = globalUserMap[sStr] || globalChatMap[sStr] || '';
                        }

                        let rawTime = timeIdx !== -1 ? row[timeIdx] : null;
                        let normTime = normalizeTimestamp(rawTime);

                        messages.push({
                            accountId: id,
                            fileName: fileName,
                            rawTime: rawTime,
                            normTime: normTime,
                            isMe: isMe,
                            senderName: senderName,
                            textContent: textContent,
                            typeVal: typeVal
                        });
                    });
                }
                return { messages, error: null };
            } catch (e) {
                console.error(`メッセージ取得失敗 (${fileName}):`, e);
                return { messages: [], error: e.message };
            }
        }

        function loadMessagesForChat(targetChat, accountId) {
            const chatView = document.getElementById('chat-view');
            chatView.innerHTML = '';

            let allMsgs = [];
            let sourceFiles = new Set();
            let errors = [];

            if (accountId === 'all' || accountId === null) {
                const relatedItems = targetChat.relatedItems || [targetChat];
                relatedItems.forEach(item => {
                    const acc = accounts[item.accountId];
                    if (acc) {
                        sourceFiles.add(acc.fileName);
                        const { messages, error } = getMessagesFromAccount(acc, item);
                        if (error) errors.push(`${acc.fileName}: ${error}`);
                        allMsgs.push(...messages);
                    }
                });
            } else {
                const acc = accounts[accountId];
                if (acc) {
                    sourceFiles.add(acc.fileName);
                    const { messages, error } = getMessagesFromAccount(acc, targetChat);
                    if (error) errors.push(`${acc.fileName}: ${error}`);
                    allMsgs.push(...messages);
                }
            }

            allMsgs.sort((a, b) => a.normTime - b.normTime);

            const sourcesStr = Array.from(sourceFiles).join(', ');
            const headerEl = document.createElement('div');
            headerEl.className = 'chat-header-info';
            headerEl.innerHTML = `
                <h2>💬 ${escapeHtml(targetChat.chatName)}</h2>
                <div style="font-size:12px; color:#555; margin-top:4px;">
                    <span>全 ${allMsgs.length} 件のメッセージ | </span>
                    <span>ソース: <strong>${escapeHtml(sourcesStr)}</strong></span>
                </div>
            `;
            chatView.appendChild(headerEl);

            if (errors.length > 0) {
                const errBox = document.createElement('div');
                errBox.className = 'error-log';
                errBox.innerHTML = `<strong>⚠️ メッセージ読み込み中の警告・エラー:</strong>\n${escapeHtml(errors.join('\n'))}`;
                chatView.appendChild(errBox);
            }

            if (allMsgs.length === 0) {
                const emptyEl = document.createElement('div');
                emptyEl.style.cssText = 'text-align:center; color:#fff; padding:30px;';
                emptyEl.innerText = '表示できるメッセージがありませんでした。';
                chatView.appendChild(emptyEl);
                return;
            }

            allMsgs.forEach(msg => {
                const sender = msg.senderName || (msg.isMe ? '自分' : targetChat.chatName);
                const timeStr = formatTimestamp(msg.normTime);

                const msgRow = document.createElement('div');
                msgRow.className = `msg-row ${msg.isMe ? 'me' : 'other'}`;
                msgRow.innerHTML = `
                    <div class="msg-header-line">
                        <span class="msg-sender-badge">${escapeHtml(sender)}</span>
                        <span class="msg-timestamp">${escapeHtml(timeStr)}</span>
                    </div>
                    <div class="bubble-container">
                        <div class="bubble">${escapeHtml(msg.textContent).replace(/\n/g, '<br>')}</div>
                    </div>
                `;
                chatView.appendChild(msgRow);
            });

            chatView.scrollTop = chatView.scrollHeight;
        }
    </script>
</body>
